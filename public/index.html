<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seleziona la Mappa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,body{
    width:100%;
    height:100%;
    background:#e9e9e9;
}

.container{
    width:100%;
    height:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:30px;
    padding:30px;
}

.button{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:white;
    border-radius:30px;
    text-decoration:none;
    color:#333;
    font-size:3rem;
    font-weight:bold;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
    transition:.25s ease;
}

.button:hover{
    transform:scale(1.02);
    box-shadow:0 16px 35px rgba(0,0,0,0.18);
}

.button:active{
    transform:scale(0.99);
}

@media (max-width: 767px){
    .container{
        grid-template-columns:1fr;
        grid-template-rows:repeat(4, 1fr);
        gap:18px;
        padding:18px;
    }
    .button{
        font-size:2rem;
        border-radius:22px;
    }
}
</style>

</head>
<body>

<div class="container">
    <a href="NuovaMappa.html?region=liguria" class="button">Liguria</a>
    <a href="NuovaMappa.html?region=piemonte" class="button">Piemonte/VDA</a>
    <a href="NuovaMappa.html?region=lombardia" class="button">Lombardia</a>
    <a href="NuovaMappa.html?region=trentino" class="button">Trentino-Alto Adige</a>
</div>

</body>
</html>
