<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convertitore OMIRL → SQL D1</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6a737d;--bd:#d8dde3;--ac:#1668d9;--ok:#1a7f37;--okbg:#e6f6ea;--warn:#b35900;--warnbg:#fff3e0;--err:#c62828}
  @media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e6e9ed;--mut:#8b949e;--bd:#323943;--ac:#4c9aff;--ok:#56d364;--okbg:#12301a;--warn:#f0a050;--warnbg:#3a2a12;--err:#ff7b72}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:16px}
  .wrap{max-width:980px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 14px;color:var(--mut)}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
  label{font-weight:600;font-size:13px}
  input[type=text],input[type=number]{padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;width:140px}
  textarea{width:100%;height:220px;margin-top:6px;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:10px}
  .row div{display:flex;flex-direction:column;gap:4px}
  button{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:8px 14px;font:inherit;font-weight:600}
  button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
  button:hover{filter:brightness(.95)}
  .stats{color:var(--mut);font-size:13px;margin:4px 0 10px}
  .ch{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
  .ch.done{background:var(--okbg);border-color:var(--ok)}
  .ch.big{border-color:var(--warn)}
  .tag{font-weight:800;min-width:52px;font-size:16px;color:var(--ac)}
  .ch.done .tag{color:var(--ok)}
  .info{flex:1;min-width:0}
  .what{font-size:14px;word-break:break-word}
  .meta{font-size:12px;color:var(--mut);margin-top:2px}
  .meta .w{color:var(--warn);font-weight:700}
  details{margin-top:4px}
  details summary{cursor:pointer;font-size:12px;color:var(--mut)}
  pre{margin:6px 0 0;max-height:180px;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px;font-size:11px;white-space:pre-wrap;word-break:break-all}
  .log{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--warn);background:var(--warnbg);border-radius:6px;padding:8px;max-height:160px;overflow:auto;white-space:pre-wrap}
  .err{color:var(--err);font-weight:600}
  @media(max-width:560px){.ch{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Convertitore OMIRL → SQL (D1)</h1>
  <p class="sub">Incolla i dati di tutte le stazioni e di tutti gli anni, premi <b>Genera</b>: ottieni una lista di comandi CH1, CH2… da copiare uno alla volta nella console D1.</p>

  <div class="card">
    <div class="row">
      <div><label for="src">Serie temperature (src)</label><input type="text" id="src" value="omirl_T"></div>
      <div><label for="upc">Max stazione-anno per comando</label><input type="number" id="upc" value="5" min="1" max="50"></div>
      <div><label for="lim">Limite caratteri D1</label><input type="number" id="lim" value="100000" min="1000"></div>
    </div>
    <label for="inp">Dati OMIRL incollati</label>
    <textarea id="inp" placeholder="Località: ALASSIO  Parametro meteorologico: Temperatura massima ..."></textarea>
    <div class="row" style="margin:10px 0 0">
      <button class="pri" id="go">Genera comandi SQL</button>
      <button id="clr">Svuota</button>
    </div>
  </div>

  <div id="out" style="display:none">
    <div class="card">
      <div class="stats" id="stats"></div>
      <div class="row" style="margin:0 0 10px"><button id="copyall">Copia tutti (uniti)</button><button id="reset">Azzera “copiati”</button></div>
      <div id="list"></div>
    </div>
    <div class="card" id="logcard" style="display:none">
      <label>Avvisi</label>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

const KINDS = ["max", "med", "min"];
const ROW = /(\d{2}\/\d{2}\/\d{4})\s*(\d{2}\/\d{2}\/\d{4})\s*(-?(?:\d+(?:[.,]\d+)?|[.,]\d+))\s*Tutti\s+i\s+dati\s*(Sì|Si|No)/gi;
const LOCALITA = /Localit[^\s:]*\s*:\s*([\s\S]+?)\s*(?=Parametro\s+meteorologico\s*:)/gi;

const norm = n => n.replace(/[’`]/g, "'").replace(/\s+/g, " ").trim().toUpperCase();

// --- tabella codici ---
const CODES = new Map(), ALTS = new Map(), NAMES = new Map();
for (const line of TABELLA.trim().split("\n")) {
  const i = line.indexOf(";"); if (i < 0) continue;
  const code = line.slice(0, i).trim(), name = line.slice(i + 1).trim(), key = norm(name);
  if (CODES.has(key)) { if (!ALTS.has(key)) ALTS.set(key, []); ALTS.get(key).push(code); }
  else CODES.set(key, code);
  if (!NAMES.has(code)) NAMES.set(code, name);
}

function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function closest(key) {
  let best = null, bs = 0;
  for (const k of CODES.keys()) {
    const s = 1 - lev(key, k) / Math.max(key.length, k.length);
    if (s > bs) { bs = s; best = k; }
  }
  return bs >= 0.9 ? best : null;
}

let LOG = [], warned = new Set();
const log = s => LOG.push(s);

function codeFor(name) {
  let key = norm(name), code = CODES.get(key);
  if (code === undefined) {
    const c = closest(key);
    if (!c) { log(`stazione sconosciuta: '${name}' (saltata)`); return null; }
    log(`'${name}' non trovata, uso '${c}'`);
    key = c; code = CODES.get(key);
  }
  if (ALTS.has(key) && !warned.has(key)) {
    warned.add(key);
    log(`nome ambiguo '${key}': uso ${code} (alternative: ${ALTS.get(key).join(", ")})`);
  }
  return code;
}

function kindOf(h) {
  const u = h.toUpperCase();
  if (u.includes("PRECIPITAZIONE")) return "rain";
  if (u.includes("MASSIMA")) return "max";
  if (u.includes("MINIMA")) return "min";
  if (u.includes("MEDIA")) return "med";
  return null;
}

function toFloat(v) {
  let s = v.replace(",", ".");
  if (s.startsWith("-.")) s = "-0" + s.slice(1);
  else if (s.startsWith(".")) s = "0" + s;
  return parseFloat(s);
}

const dk = (y, m, d) => y * 10000 + m * 100 + d;
const unk = k => [Math.floor(k / 10000), Math.floor(k / 100) % 100, k % 100];
const pad = n => String(n).padStart(2, "0");

function parse(text) {
  const stations = new Map();
  const parts = text.split(LOCALITA);
  if (parts.length === 1) { log("non trovo 'Località:' seguito da 'Parametro meteorologico:'."); return stations; }
  for (let i = 1; i < parts.length; i += 2) {
    const name = parts[i], body = parts[i + 1] || "";
    const code = codeFor(name); if (!code) continue;
    if (!stations.has(code)) stations.set(code, {max: new Map(), med: new Map(), min: new Map(), rain: new Map()});
    const data = stations.get(code);
    const sections = body.split(/Parametro\s+meteorologico\s*:/i);
    for (const sec of sections.slice(1)) {
      const he = sec.toUpperCase().indexOf("INIZIO RILEVAZIONE");
      const header = he === -1 ? sec.slice(0, 250) : sec.slice(0, he);
      const kind = kindOf(header);
      if (!kind) { log(`${code}: parametro non riconosciuto: ${header.slice(0, 100).trim()}`); continue; }
      for (const m of sec.matchAll(ROW)) {
        const [, ds, , val, valid] = m;
        const [d, mo, y] = ds.split("/").map(Number);
        if (valid.toUpperCase() === "NO") { log(`${code}: salto ${ds} (${kind}): dato non valido`); continue; }
        data[kind].set(dk(y, mo, d), toFloat(val));
      }
    }
  }
  return stations;
}

const meseKey = (y, m) => pad(m) + pad(y % 100);

function stationRows(code, data, src) {
  const byYear = new Map();
  const push = (y, r) => { if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(r); };
  const days = [...new Set([...data.max.keys(), ...data.med.keys(), ...data.min.keys()])].sort((a, b) => a - b);
  for (const day of days) {
    const vals = KINDS.map(k => data[k].get(day));
    const [y, m, d] = unk(day);
    if (vals.some(v => v === undefined)) {
      const miss = KINDS.filter((k, i) => vals[i] === undefined);
      log(`${code}: manca ${miss.join(", ")} per ${pad(d)}/${pad(m)}/${y}: salto il giorno`);
      continue;
    }
    push(y, `('${meseKey(y, m)}', ${d}, '${src}', '${code}', '${vals.map(v => v.toFixed(1)).join(",")}')`);
  }
  for (const day of [...data.rain.keys()].sort((a, b) => a - b)) {
    const [y, m, d] = unk(day);
    push(y, `('${meseKey(y, m)}', ${d}, 'omirl', '${code}', '${data.rain.get(day).toFixed(1)}')`);
  }
  return byYear;
}

const HEAD = "INSERT OR REPLACE INTO archivio (mese, giorno, src, st, v) VALUES\n";

function build(text, src, UPC, LIM) {
  LOG = []; warned = new Set();
  const stations = parse(text);
  const units = [];
  for (const [code, data] of stations) {
    const by = stationRows(code, data, src);
    if (!by.size) log(`${code}: nessun dato utile`);
    for (const y of [...by.keys()].sort((a, b) => a - b)) units.push({code, year: y, rows: by.get(y)});
  }
  const commands = [];
  let cur = [], curRows = [], curLen = HEAD.length + 1;
  for (const u of units) {
    const add = u.rows.reduce((s, r) => s + r.length + 2, 0);
    if (cur.length && (cur.length >= UPC || curLen + add > LIM)) {
      commands.push({members: cur, rows: curRows});
      cur = []; curRows = []; curLen = HEAD.length + 1;
    }
    cur.push(u); curRows.push(...u.rows); curLen += add;
  }
  if (cur.length) commands.push({members: cur, rows: curRows});
  commands.forEach(c => { c.sql = HEAD + c.rows.join(",\n") + ";"; });
  return {commands, units, nSt: new Set(units.map(u => u.code)).size,
          total: units.reduce((s, u) => s + u.rows.length, 0)};
}

// --- UI ---
const $ = id => document.getElementById(id);
let current = null;

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove(); return ok;
  }
}

function describe(members) {
  // raggruppa per stazione: "ALASSIO (2019, 2020) · ALBENGA (2019)"
  const g = new Map();
  for (const m of members) { if (!g.has(m.code)) g.set(m.code, []); g.get(m.code).push(m.year); }
  return [...g].map(([c, ys]) => `${NAMES.get(c) || c} [${c}] ${ys.join(", ")}`).join("  ·  ");
}

function render() {
  const list = $("list"); list.innerHTML = "";
  current.commands.forEach((c, i) => {
    const big = c.sql.length > current.LIM;
    const div = document.createElement("div");
    div.className = "ch" + (big ? " big" : "");
    div.innerHTML = `<div class="tag">CH${i + 1}</div>
      <div class="info">
        <div class="what"></div>
        <div class="meta"></div>
        <details><summary>Anteprima SQL</summary><pre></pre></details>
      </div><button class="pri">Copia</button>`;
    div.querySelector(".what").textContent = "Chiama: " + describe(c.members);
    div.querySelector(".meta").innerHTML =
      `${c.members.length} stazione-anno · ${c.rows.length} righe · ${c.sql.length.toLocaleString("it-IT")} caratteri` +
      (big ? ` · <span class="w">supera il limite D1, potrebbe essere rifiutato</span>` : "");
    div.querySelector("pre").textContent = c.sql.length > 3000 ? c.sql.slice(0, 3000) + "\n…" : c.sql;
    const btn = div.querySelector("button");
    btn.onclick = async () => {
      if (await copyText(c.sql)) { div.classList.add("done"); btn.textContent = "Copiato ✓"; btn.classList.remove("pri"); }
      else btn.textContent = "Errore";
    };
    list.appendChild(div);
  });
}

$("go").onclick = () => {
  const text = $("inp").value;
  const src = ($("src").value.trim() || "omirl_T").replace(/'/g, "");
  const UPC = Math.max(1, parseInt($("upc").value) || 5);
  const LIM = Math.max(1000, parseInt($("lim").value) || 100000);
  const r = build(text, src, UPC, LIM);
  r.LIM = LIM; current = r;
  $("out").style.display = "block";
  if (!r.commands.length) {
    $("stats").innerHTML = `<span class="err">Nessun dato riconosciuto. Controlla il testo incollato e i titoli dei parametri.</span>`;
    $("list").innerHTML = "";
  } else {
    $("stats").textContent = `${r.nSt} stazioni · ${r.units.length} stazione-anno · ${r.total} righe · ${r.commands.length} comandi`;
    render();
  }
  $("logcard").style.display = LOG.length ? "block" : "none";
  $("log").textContent = LOG.map(l => "-- " + l).join("\n");
};
$("clr").onclick = () => { $("inp").value = ""; $("out").style.display = "none"; current = null; };
$("reset").onclick = () => current && render();
$("copyall").onclick = async e => {
  if (!current) return;
  const ok = await copyText(current.commands.map(c => c.sql).join("\n\n"));
  e.target.textContent = ok ? "Copiati tutti ✓" : "Errore";
  setTimeout(() => e.target.textContent = "Copia tutti (uniti)", 2000);
};
</script>
