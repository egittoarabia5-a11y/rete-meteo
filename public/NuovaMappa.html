  if (value === null) return "#808080";

  if (variable === "hum") {
    if (value < 20) return "#b44141";
    else if (value < 30) return "#ff6262";
    else if (value < 40) return "#ff9d56";
    else if (value < 50) return "#f1d800";
    else if (value < 60) return "#65d050";
    else if (value < 70) return "#6ca561";
    else if (value < 80) return "#4dc8ff";
    else if (value < 90) return "#4da9ff";
    return "#4d54ff";
  }

  if (variable === "rainDaily" || variable === "rainRate") {
    if (value === 0) return "#808080";
    else if (value < 2) return "#f9ae6c";
    else if (value < 5) return "#f9966c";

    else if (value < 20) return "#65d050";

// Media climatologica mensile della T media = (T max media + T min media) / 2
function getMonthMeanClim(st) {
  if (st.tempMeanClimAvg != null && !isNaN(Number(st.tempMeanClimAvg))) {
    return Number(st.tempMeanClimAvg);
  }
  if (st.tempHighClimAvg != null && st.tempLowClimAvg != null) {
    return (Number(st.tempHighClimAvg) + Number(st.tempLowClimAvg)) / 2;
  }
  return null;
}

// ================= GET VALUE =================
function getValueAndColor(st) { 
 function getMonthToDateAverage(days) {

  if (!Array.isArray(days)) return null;

  const now = new Date();
  const today = now.getDate();

  const values = days
    .slice(0, today)
    .filter(v => v != null && !isNaN(v))
    .map(Number);

  if (!values.length) return null;

  return values.reduce((sum, v) => sum + v, 0) / values.length;
}
  const mode = modes[currentVariable]; 
  let value = null; 
  let colorVariable = currentVariable; 
 
const get = (base) => { 
    if (mode === "current") return st[base]; 
    if (mode === "max") return st[base + "High"]; 
    if (mode === "min") return st[base + "Low"]; 

    // Media climatologica = valore reale - anomalia
    if (mode === "current-mean") {
      const v = st[base + "Mean"];
      const a = st[base + "MeanAnom"];
      return (v != null && a != null) ? Number(v) - Number(a) : null;
    }
    if (mode === "max-mean") {
      const v = st[base + "High"];
      const a = st[base + "HighAnom"];
      return (v != null && a != null) ? Number(v) - Number(a) : null;
    }
    
    if (mode === "min-mean") {
      const v = st[base + "Low"];
      const a = st[base + "LowAnom"];
      return (v != null && a != null) ? Number(v) - Number(a) : null;
    }
 
    return null; 
  };
 
  if (currentVariable === "temp") { 
    value = get("temp"); 
  } 
   else if (currentVariable === "media") {

    // ===== GIORNALIERE (climatologiche, riprese da Temperatura) =====
    if (mode === "current-mean") {
      value = (st.tempMean != null && st.tempMeanAnom != null)
        ? Number(st.tempMean) - Number(st.tempMeanAnom)
        : null;
    }
    else if (mode === "max-mean") {
      // Valore climatologico del giorno (da climatologia.json)
      value = (st.tempHigh != null && st.tempHighAnom != null)
        ? Number(st.tempHigh) - Number(st.tempHighAnom)
        : null;
    }
    else if (mode === "min-mean") {
      // Valore climatologico del giorno (da climatologia.json)
      value = (st.tempLow != null && st.tempLowAnom != null)
        ? Number(st.tempLow) - Number(st.tempLowAnom)
        : null;
    }

    else if (mode === "current-mean-anom") {
      value = st.tempMeanAnom ?? null;
      colorVariable = "anom";
    }
    else if (mode === "max-mean-anom") {
      value = st.tempHighAnom ?? null;
      colorVariable = "anom";
    }
    else if (mode === "min-mean-anom") {
      value = st.tempLowAnom ?? null;
      colorVariable = "anom";
    }

    // ===== MENSILI (archivioLiguria) =====
    else if (mode === "month-mean") {
      value = getMonthMeanClim(st);
    }
    else if (mode === "month-max-mean") {
      // Media climatologica dal giorno 1 al giorno corrente del mese
      value = st.tempHighClimAvg ?? null;
    }
    else if (mode === "month-min-mean") {
      // Media climatologica dal giorno 1 al giorno corrente del mese
      value = st.tempLowClimAvg ?? null;
    }

    else if (mode === "month-mean-anom") {
      value = st.monthMeanAnom ?? null;
      colorVariable = "anom";
    }
    else if (mode === "month-max-mean-anom") {
      value = st.monthHighAnom ?? null;
      colorVariable = "anom";
    }
    else if (mode === "month-min-mean-anom") {
      value = st.monthLowAnom ?? null;
      colorVariable = "anom";
    }
  }
  else if (currentVariable === "dewp") value = get("dewp"); 
  else if (currentVariable === "heat") value = get("heat"); 
  else if (currentVariable === "hum") value = get("hum"); 
  else if (currentVariable === "rainDaily") value = st.rainDaily; 
  else if (currentVariable === "rainRate") value = st.rainRate; 
  else if (currentVariable === "rainYearly") value = st.rainYearly; 
 
  if (value !== null) { 
    value = Number(value); 
    if (isNaN(value)) value = null; 
  } 

  const isAnom =
    currentVariable === "media" && mediaAnomModes.includes(mode);

  return { 
    value, 
    color: getColor(colorVariable, value), 

    valueStr:
      value !== null
        ? (
            isAnom
              ? (
                  value > 0
                    ? `+${value.toFixed(1)}`
                    : value.toFixed(1)
                )
              : value.toFixed(1)
          )
        : ""
  };

// ================= UPDATE LAYER =================
function updateLayer() {
  const currentZoom = map.getZoom();

  geojson.features = Object.values(allStations)
    .map(st => {
      const { value, color, valueStr } = getValueAndColor(st);

      // Se non c'è valore (stazione offline), escludi del tutto la stazione: niente pallino
      if (value === null) {
        return null;
      }

      let textDisplay = "";
      if (value !== null) {
        textDisplay = currentZoom < 6 ? Math.round(value).toString() : valueStr;
      }

     const iconId = is3D
  ? getOrCreatePinIcon(map, color)
  : getOrCreateDotIcon(map, color);
      return {
        type: "Feature",
        geometry: { type: "Point", coordinates: [st.lon, st.lat] },
        properties: {
          id: st.id,
          name: st.N,
          source: st.source,
          value,
          valueStr,
          textDisplay,
          color,
          icon: iconId
        }
      };
    })
    .filter(f => f !== null); // 👈 rimuove le stazioni senza anomalia

  const source = map.getSource('weather-stations');
  if (source) source.setData(geojson);
}

function loadSdfIcon(map, id, svgString, size = 64) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      const imageData = ctx.getImageData(0, 0, size, size);

      if (!map.hasImage(id)) {
        map.addImage(id, imageData, { pixelRatio: 2, sdf: true });
      }
      resolve();
    };
    img.onerror = reject;
    // charset esplicito: risolve molti InvalidStateError su SVG data-URI
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
  });
}

function getOrCreatePinIcon(map, hexColor, size = 156) {
  const id = 'pin-' + hexColor.replace('#', '');
  if (pinIconCache.has(id) || map.hasImage(id)) return id;

  const s = size / 52;
  const w = Math.ceil(52 * s);
  const h = Math.ceil(68 * s);

  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  // Sagoma a goccia
  ctx.beginPath();
  ctx.moveTo(26 * s, 4 * s);
  ctx.bezierCurveTo(14.95 * s, 4 * s, 6 * s, 13.05 * s, 6 * s, 24.1 * s);
  ctx.bezierCurveTo(6 * s, 37.25 * s, 26 * s, 64 * s, 26 * s, 64 * s);
  ctx.bezierCurveTo(26 * s, 64 * s, 46 * s, 37.25 * s, 46 * s, 24.1 * s);
  ctx.bezierCurveTo(46 * s, 13.05 * s, 37.05 * s, 4 * s, 26 * s, 4 * s);
  ctx.closePath();

  // Corpo del pin: BIANCO con contorno grigio chiaro
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.lineWidth = 2.5 * s;
  ctx.strokeStyle = '#999999';
  ctx.stroke();

  // Pallino centrale colorato (stesso colore usato in modalità piatta)
  ctx.beginPath();
  ctx.arc(26 * s, 24 * s, 15 * s, 0, Math.PI * 2);
  ctx.fillStyle = hexColor;
  ctx.fill();

  const imageData = ctx.getImageData(0, 0, w, h);
  map.addImage(id, imageData, { pixelRatio: 2 });
  pinIconCache.add(id);
  return id;
}
function getOrCreateDotIcon(map, hexColor, size = 128) {

// Media climatologica (tmax/tmin) dal giorno 1 del mese al giorno corrente,
// applicando un'eventuale correzione costante (stessa usata per l'anomalia del giorno).
function computeClimAvgToDate(climateDaily, tmaxCorrection = 0, tminCorrection = 0) {
  if (!climateDaily) return { avgMax: null, avgMin: null };

  const now = new Date();
  const today = now.getDate();
  const month = String(now.getMonth() + 1).padStart(2, "0");

  let sumMax = 0, countMax = 0;
  let sumMin = 0, countMin = 0;

  for (let day = 1; day <= today; day++) {
    const dayKey = month + "-" + String(day).padStart(2, "0");
    const clim = climateDaily[dayKey];
    if (!clim) continue;

    if (clim.tmax != null) {
      sumMax += Number(clim.tmax) + tmaxCorrection;
      countMax++;
    }
    if (clim.tmin != null) {
      sumMin += Number(clim.tmin) + tminCorrection;
      countMin++;
    }
  }

  return {
    avgMax: countMax ? +(sumMax / countMax).toFixed(1) : null,
    avgMin: countMin ? +(sumMin / countMin).toFixed(1) : null
  };
}
// Media climatologica sull'INTERO mese (giorno 1 -> ultimo giorno del mese),
// usata per "T Max Media Mese" / "T Min Media Mese" (valore mostrato, non anomalia).
function computeClimAvgFullMonth(climateDaily, tmaxCorrection = 0, tminCorrection = 0) {
  if (!climateDaily) return { avgMax: null, avgMin: null };

  const now = new Date();
  const month = now.getMonth() + 1;
  const year = now.getFullYear();
  const lastDay = new Date(year, month, 0).getDate(); // ultimo giorno del mese corrente
  const monthStr = String(month).padStart(2, "0");

  let sumMax = 0, countMax = 0;
  let sumMin = 0, countMin = 0;

  for (let day = 1; day <= lastDay; day++) {
    const dayKey = monthStr + "-" + String(day).padStart(2, "0");
    const clim = climateDaily[dayKey];
    if (!clim) continue;

    if (clim.tmax != null) {

      countMax++;
    }
    if (clim.tmin != null) {

    }
  }

  };
}

const fetchOMIRL = async () => {
  try {

    // ==========================================================
    // STAZIONI OMIRL CON CLIMATOLOGIA
    //
    // Per aggiungere una stazione basta UNA riga:
    //
    //   ID_OMIRL: ["NOME_IN_CLIMATOLOGIA", correzioneMax, correzioneMin],
    //
    // - ID_OMIRL: l'id della stazione nel json di OMIRL (es. ROCNE)
    // - NOME_IN_CLIMATOLOGIA: il campo "S" in climatologia.json (es. A_ROCNR)
    // - correzioneMax / correzioneMin: scarto (°C) da sommare alla
    //   climatologia, metti 0 se la climatologia è già quella della stazione
    // ==========================================================

    const anomalyCorrections = {

      ROCNE: ["A_ROCNR", 0, 0],
      INASV: ["A_INASV", 0, 0],
      MIGNA: ["A_MIGNA", 0, 0],
      IMPER: ["A_IMPER", 0, 0],
      CCHER: ["A_CICHE", 0, 0],
      TAVRN: ["A_TAVAR", 0, 0],
      MTECA: ["A_MOCAP", 0, 0],

    };


    // ==============================
    // DATA IN ORA DI ROMA
    // ==============================

    const dateParts = new Intl.DateTimeFormat("en-GB", {
      timeZone: "Europe/Rome",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());

    const month = dateParts.find((p) => p.type === "month").value; // "01".."12"
    const day = Number(dateParts.find((p) => p.type === "day").value); // 1..31


    // ==============================
    // CLIMATOLOGIA
    // ==============================

    const climatologia = await climatologiaPromise;

    // climatologia.json può essere un array di stazioni o una sola stazione
    const climateList = Array.isArray(climatologia)
      ? climatologia
      : [climatologia];

    // "11.2, 11.6, ..." -> [11.2, 11.6, ...]
    const parseList = (str) =>
      String(str ?? "")
        .split(",")
        .map((v) => v.trim())
        .filter((v) => v !== "")
        .map(Number);

    // Climatologia di oggi per una stazione di climatologia.json:
    //   day   = { tmax, tmin, tmean } del giorno odierno
    //           (es. 5/10 -> 5° valore del mese 10; il 29/02 usa l'ultimo)
    //   month = { tmax, tmin } medie dell'intero mese (campo MD)
    // Il risultato è messo in cache, così ogni stazione è letta una volta sola.
    const climateCache = {};

    const getClimate = (name) => {

      if (climateCache[name]) return climateCache[name];

      const result = { day: null, month: null };

      const entry = climateList.find((c) => c?.S === name);
      const m = entry?.months?.find((x) => x.M === month);

      if (!m) {
        console.warn(
          `⚠️ Climatologia "${name}" (mese ${month}) non trovata in climatologia.json`
        );
        climateCache[name] = result;
        return result;
      }

      const maxList = parseList(m.MX);
      const minList = parseList(m.MN);
      const mdList = parseList(m.MD);

      if (maxList.length && minList.length) {

        const tmax = maxList[Math.min(day, maxList.length) - 1];
        const tmin = minList[Math.min(day, minList.length) - 1];

        if (!isNaN(tmax) && !isNaN(tmin)) {
          result.day = {
            tmax,
            tmin,
            tmean: (tmax + tmin) / 2
          };
        }
      }

      if (mdList.length >= 2 && !isNaN(mdList[0]) && !isNaN(mdList[1])) {
        result.month = {
          tmax: mdList[0],
          tmin: mdList[1]
        };
      }

      climateCache[name] = result;
      return result;
    };


    // ==============================
    // FETCH OMIRL
    // ==============================

    const res = await fetch(
      "https://api-stazioni-meteo.eggittof.workers.dev/omirl.json"
    );

    if (!res.ok) {
      throw new Error(`Errore HTTP OMIRL: ${res.status}`);
    }

    const data = await res.json();

    const stations = data?.stations || [];

    if (!stations.length) return;


    // ==============================
    // STAZIONI
    // ==============================

    stations.forEach((st) => {

      const id = st.id;

      const lat = Number(st.lat);
      const lon = Number(st.lon);

      if (isNaN(lat) || isNaN(lon)) return;


      // ==============================
      // TEMPERATURE
      // ==============================

      const temp = st.temp ?? null;
      const tempHigh = st.tempHigh ?? null;
      const tempLow = st.tempLow ?? null;
      const tempMean = st.tempMean ?? null;


      // ==============================
      // ANOMALIE E MEDIE MENSILI
      // ==============================

      let tempMeanAnom = null;
      let tempHighAnom = null;
      let tempLowAnom = null;

      // Medie climatologiche del mese (menu Medie -> "Media Mese")
      let tempHighClimAvg = null;
      let tempLowClimAvg = null;
      let tempMeanClimAvg = null;

      const config = anomalyCorrections[id];

      if (config) {

        const [
          climateName,
          tmaxCorrection,
          tminCorrection
        ] = config;

        const climate = getClimate(climateName);


        // ----- Giorno odierno -----

        if (climate.day) {

          const climateTmax = climate.day.tmax + tmaxCorrection;
          const climateTmin = climate.day.tmin + tminCorrection;

          // MAX

          if (tempHigh !== null) {
            tempHighAnom = Number(tempHigh) - climateTmax;
          }

          // MIN

          if (tempLow !== null) {
            tempLowAnom = Number(tempLow) - climateTmin;
          }

          // MEDIA (media tra max e min climatologici del giorno)

          if (tempMean !== null) {
            tempMeanAnom =
              Number(tempMean) -
              (climateTmax + climateTmin) / 2;

const fetchArchivioLiguria = async () => {

  try {

    const climatologia = await climatologiaPromise;

    const now = new Date();
    const today = now.getDate();
    const month = String(now.getMonth() + 1).padStart(2, "0");

    for (const [id, cfg] of Object.entries(archivioStations)) {

      try {

        const res = await fetch(
          `https://api-stazioni-meteo.eggittof.workers.dev/archivioLiguria.json?stazione=${cfg.code}`
        );

        if (!res.ok) continue;

        const data = await res.json();
        const record = data?.stations?.find(s => s.S === cfg.code) || data?.stations?.[0];

        if (!record) continue;

        const tmaxCorrection = cfg.tmaxCorrection || 0;
        const tminCorrection = cfg.tminCorrection || 0;

        const mxArr = record.MX.split(",").map(v => v.trim());
        const mnArr = record.MN.split(",").map(v => v.trim());

        const climateDaily = climatologia?.[cfg.climate]?.daily || {};

        let sumMax = 0, countMax = 0;
        let sumMin = 0, countMin = 0;
        let sumMean = 0, countMean = 0;

        let sumClimTmax = 0, countClimTmax = 0;
        let sumClimTmin = 0, countClimTmin = 0;
        let sumClimTmean = 0, countClimTmean = 0;

        for (let day = 1; day <= today; day++) {

          const idx = day - 1;

          const maxRaw = mxArr[idx];
          const minRaw = mnArr[idx];

          const dayKey = month + "-" + String(day).padStart(2, "0");
          const clim = climateDaily[dayKey];

          const max = (maxRaw != null && maxRaw !== "ND") ? Number(maxRaw) : null;
          const min = (minRaw != null && minRaw !== "ND") ? Number(minRaw) : null;

          if (max != null) {
            sumMax += max;
            countMax++;

            if (clim?.tmax != null) {
              sumClimTmax += Number(clim.tmax) + tmaxCorrection;
              countClimTmax++;
            }
          }

          if (min != null) {
            sumMin += min;
            countMin++;

            if (clim?.tmin != null) {
              sumClimTmin += Number(clim.tmin) + tminCorrection;
              countClimTmin++;
            }
          }

          if (max != null && min != null) {
            sumMean += (max + min) / 2;
            countMean++;

            if (clim?.tmean != null) {
              sumClimTmean += Number(clim.tmean);
              countClimTmean++;
            }
          }
        }

        const monthHigh = countMax ? +(sumMax / countMax).toFixed(1) : null;
        const monthLow  = countMin ? +(sumMin / countMin).toFixed(1) : null;
        const monthMean = countMean ? +(sumMean / countMean).toFixed(1) : null;

        const monthHighAnom = (monthHigh != null && countClimTmax)
          ? +(monthHigh - (sumClimTmax / countClimTmax)).toFixed(1)
          : null;

        const monthLowAnom = (monthLow != null && countClimTmin)
          ? +(monthLow - (sumClimTmin / countClimTmin)).toFixed(1)
          : null;

        const monthMeanAnom = (monthMean != null && countClimTmean)
          ? +(monthMean - (sumClimTmean / countClimTmean)).toFixed(1)
          : null;

        if (!allStations[id]) {
          console.warn(`⚠️ archivioLiguria: stazione base "${id}" non ancora presente in allStations, salto l'aggancio delle medie mensili per questo ciclo.`);
          continue; // stazione base non ancora caricata
        }

        allStations[id] = {
          ...allStations[id],
          monthMean,
          monthHigh,
          monthLow,
          monthMeanAnom,
          monthHighAnom,
          monthLowAnom
        };

        updateLayer();

      } catch (err) {
        console.error(`Errore archivioLiguria per ${id}:`, err);
      }
    }

  } catch (err) {
    console.error("Errore fetchArchivioLiguria:", err);
  }
};

    tempLowAnom =
      Number(tempLow) - Number(climate.tmin);
  }

  // Media climatologica dal giorno 1 al giorno corrente
  const avgGA = computeClimAvgFullMonth(climatologia?.genova_sestri_ponente?.daily ?? null, 0, 0);
  tempHighClimAvg = avgGA.avgMax;
  tempLowClimAvg = avgGA.avgMin;
}


// ==========================================
// CLIMATOLOGIA VILLANOVA AEROPORTO
// BASATA SU ALBENGA
// ==========================================

else if (id === "Villanova Aeroporto") {

  const albengaClimate =
    climatologia?.albenga?.daily?.[climatologyDay] ?? null;

  if (albengaClimate) {

    tempMeanAnom = 0;

    // Anomalia della massima
    if (
      tempHigh !== null &&
      albengaClimate.tmax !== null &&
      albengaClimate.tmax !== undefined
    ) {
      tempHighAnom =
        Number(tempHigh) - Number(albengaClimate.tmax);
    }

    // Anomalia della minima
    if (
      tempLow !== null &&
      albengaClimate.tmin !== null &&
      albengaClimate.tmin !== undefined
    ) {
      tempLowAnom =
        Number(tempLow) - Number(albengaClimate.tmin);
    }
  }

  // Media climatologica dal giorno 1 al giorno corrente
  const avgVA = computeClimAvgFullMonth(climatologia?.albenga?.daily ?? null, 0, 0);
  tempHighClimAvg = avgVA.avgMax;
  tempLowClimAvg = avgVA.avgMin;
}
// ==========================================
// CLIMATOLOGIA SARZANA AEROPORTO
// BASATA SU SARZANA
// ==========================================

else if (id === "Sarzana Aeroporto") {

  const sarzanaClimate =
    climatologia?.sarzana?.daily?.[climatologyDay] ?? null;

  if (sarzanaClimate) {

    tempMeanAnom = 0;

    // Anomalia della massima
    if (
      tempHigh !== null &&
      sarzanaClimate.tmax !== null &&
      sarzanaClimate.tmax !== undefined
    ) {
      tempHighAnom =
        Number(tempHigh) - Number(sarzanaClimate.tmax);
    }

    // Anomalia della minima
    if (
      tempLow !== null &&
      sarzanaClimate.tmin !== null &&
      sarzanaClimate.tmin !== undefined
    ) {
      tempLowAnom =
        Number(tempLow) - Number(sarzanaClimate.tmin);
    }
  }

  // Media climatologica dal giorno 1 al giorno corrente
  const avgSA = computeClimAvgFullMonth(climatologia?.sarzana?.daily ?? null, 0, 0);
  tempHighClimAvg = avgSA.avgMax;
  tempLowClimAvg = avgSA.avgMin;
}
      // ==========================================
      // CLIMATOLOGIA GENOVA OREGINA
      // ==========================================

      else if (id === "Genova Righi" && climate) {

        tempMeanAnom = 0;

        // Oregina: -0.9 °C sulle massime
        const climateTmax =
          Number(climate.tmax) - 0.9;

        // Oregina: -0.8 °C sulle minime
        const climateTmin =
          Number(climate.tmin) - 0.8;

        // Anomalia della massima
        if (tempHigh !== null) {
          tempHighAnom =
            Number(tempHigh) - climateTmax;
        }

        // Anomalia della minima
        if (tempLow !== null) {
          tempLowAnom =
            Number(tempLow) - climateTmin;
        }

        // Media climatologica dal giorno 1 al giorno corrente
        const avgGR = computeClimAvgFullMonth(climatologia?.genova_sestri_ponente?.daily ?? null, -0.9, -0.8);
        tempHighClimAvg = avgGR.avgMax;
        tempLowClimAvg = avgGR.avgMin;
      }
    


      // ==============================
      // SALVATAGGIO STAZIONE
      // ==============================

      allStations[id] = {

        id,
        source: "AERIS",

        // Temperatura
        temp,
        tempHigh,
        tempLow,

        // Anomalie temperatura
        tempMeanAnom,
        tempHighAnom,
        tempLowAnom,

        // Media climatologica mese in corso
        tempHighClimAvg,
        tempLowClimAvg,


        // Dewpoint
        dewp: st.D ?? null,
        dewpHigh: st.DH ?? null,
        dewpLow: st.DL ?? null,


        // Heat Index
        heat: st.HI ?? null,
        heatHigh: st.HIH ?? null,
        heatLow: st.HIL ?? null,


        // Umidità
        hum: st.H ?? null,
        humHigh: st.HH ?? null,
        humLow: st.HL ?? null,


        // Pressione
        pressure: st.P ?? null,
        pressureHigh: st.PH ?? null,
        pressureLow: st.PL ?? null,


        // Vento
        wind: st.V ?? null,
        windHigh: st.VH ?? null,
        windLow: st.VL ?? null,


        // Raffica
        windGust: st.G ?? null,
        windGustHigh: st.GH ?? null,


        // Direzione vento
        windDir: st.WD ?? null,


        // Pioggia
        rainDaily: st.R ?? null,
        rainRate: st.RR ?? null,


        // Radiazione
        rad: st.RAD ?? null,
        radHigh: st.RADH ?? null,
        radLow: st.RADL ?? null,


        // Coordinate
        lat,
        lon,


        // Timestamp
        time: st.timestamp ?? null
      };


      // Aggiorna la stazione sulla mappa
      updateLayer(id);

    });

  } catch (err) {

    console.error("❌ fetchAERIS error:", err);

  }
}
async function fetchNetatmoGenova() {
  try {

    const res = await fetch(
      "https://api-stazioni-meteo.eggittof.workers.dev/netatmo.json"
    );

    const data = await res.json();

    if (!data?.stations) {
      console.warn("❌ nessuna stations Netatmo");
      return;
    }

    data.stations.forEach(st => {

      const id = st.id;

      const lat = Number(st.lat);
      const lon = Number(st.lon);

      if (!lat || !lon) return;

      allStations[id] = {
        source: "NETATMO",

        // ================= TEMPERATURE =================
        temp: st.T ?? null,
        tempHigh: st.TH ?? null,
        tempLow: st.TL ?? null,

        // ================= DEWPOINT =================
        dewp: st.D ?? null,
        dewpHigh: st.DH ?? null,
        dewpLow: st.DL ?? null,

        // ================= HEAT INDEX =================
        heat: st.HI ?? null,
        heatHigh: st.HIH ?? null,
        heatLow: st.HIL ?? null,

        // ================= HUMIDITY =================
        hum: st.H ?? null,
        humHigh: st.HH ?? null,
        humLow: st.HL ?? null,

        // ================= PRESSURE =================
        pressure: st.P ?? null,
        pressureHigh: st.PH ?? null,
        pressureLow: st.PL ?? null,

        // ================= WIND =================
        wind: st.V ?? null,
        windHigh: st.WH ?? null,
        windLow: st.WL ?? null,

        windGust: st.G ?? null,
        windGustHigh: st.GH ?? null,

        windDir: st.WD ?? null,

        // ================= PRECIPITATION =================
        rainDaily: st.R ?? null,
        rainRate: st.RR ?? null,

        // ================= RADIATION =================
        rad: st.RAD ?? null,
        radHigh: st.RADH ?? null,
        radLow: st.RADL ?? null,

        // ================= META =================
        lat,
        lon,
        time: st.timestamp ?? null
      };

      updateLayer(id);

    });

  } catch (err) {

    console.error("❌ fetchNetatmoGenova error:", err);

  }
}
let isRefreshing = false;
function setRegion(region){

  currentRegion = region;

  clearAllIntervals();
  clearPreviousRegionStations();

  if(region === "liguria") startLiguria();
  if(region === "piemonte") startPiemonte();
  if(region === "lombardia") startLombardia();
  if(region === "trentino") startTrentino();

  document.getElementById("regionButton").innerText =
    region.charAt(0).toUpperCase() + region.slice(1);
}
document.getElementById("regionButton").onclick = () => {
  const m = document.getElementById("regionMenu");
  m.style.display = m.style.display === "block" ? "none" : "block";
};

document.querySelectorAll("#regionMenu button").forEach(btn=>{
  btn.onclick = () => {
    setRegion(btn.dataset.region);
    document.getElementById("regionMenu").style.display = "none";
  };
});
document
  .getElementById("refreshRegionButton")
document
  .getElementById("refreshRegionButton")
  .addEventListener("click", () => {

    const btn = document.getElementById("refreshRegionButton");

    btn.style.transform = "rotate(360deg)";

    setTimeout(() => {
      btn.style.transform = "";
    }, 500);

    isRefreshing = true;

    switch(currentRegion){

      case "liguria":
        startLiguria(false);
        break;

      case "piemonte":
        startPiemonte(false);
        break;

      case "lombardia":
        startLombardia(false);
        break;

      case "trentino":
        startTrentino(false);
        break;
    }

    setTimeout(() => {
      isRefreshing = false;
    }, 1500);

  });
  setRegion("liguria");

  // Avvio
function loadLiguriaData(){

  Object.keys(stations).forEach(id =>
    fetchPws(id, stations)
  );

  fetchOMIRL();
  fetchIgnorete();
  fetchComuneGenova();
  fetchLimet();
  fetchPWSGenova().then(fetchArchivioLiguria);
  fetchWeatherLinkLIG();
  fetchGepo();
}
function startLiguria(clear = true){

  clearAllIntervals();
  if (clear) clearPreviousRegionStations();

  regionStationIds = new Set(Object.keys(stations));

  loadLiguriaData();

  intervals.push(setInterval(() => {
    Object.keys(stations).forEach(id =>
      fetchPws(id, stations)
    );
  }, 300000));

  intervals.push(setInterval(fetchOMIRL, 300000));
  intervals.push(setInterval(fetchIgnorete, 300000));
  intervals.push(setInterval(fetchComuneGenova, 300000));
  intervals.push(setInterval(fetchLimet, 300000));
  intervals.push(setInterval(fetchPWSGenova, 300000));  
  intervals.push(setInterval(fetchGepo, 300000));
  intervals.push(setInterval(fetchArchivioLiguria, 900000));
  
}

function startLombardia(clear = true){

  clearAllIntervals();

  if (typeof stationsLombardia !== "undefined") {

    regionStationIds = new Set([
      ...Object.keys(stationsLombardia)
    ]);

    Object.keys(stationsLombardia).forEach(id =>

    );

    intervals.push(setInterval(() => {

  fetchCML();

function startTrentino(clear = true){

  clearAllIntervals();
  if (clear) clearPreviousRegionStations();

  fetchMeteoTrentino();
  intervals.push(setInterval(fetchMeteoTrentino, 600000));
}
