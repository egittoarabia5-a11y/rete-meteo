<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1420;
    --page-bg:#0e1420;
    --paper:#f3ede0;
    --brass:#c99a4b;
    --glass: rgba(243,237,224,0.07);
    --glass-strong: rgba(243,237,224,0.13);
    --line: rgba(243,237,224,0.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    background-color: var(--page-bg);
    color: var(--paper);
    min-height:100vh;
    overflow-x:hidden;
  }

  .page{
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 22px 60px;
  }

  /* ---------- intestazione: nome | dati attuali | orario ---------- */
  .head{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:16px;
    padding: 4px 2px 20px;
    border-bottom:1px solid var(--line);
  }
  .head-name{
    font-weight:500;
    font-size:22px;
  }
  .head-data{
    font-size:18px;
    font-weight:500;
    text-align:center;
  }
  .head-time{
    font-size:13px;
    opacity:.75;
    text-align:right;
  }
  .head-time b{ font-weight:500; opacity:1; }

  .back{
    display:inline-block;
    margin: 14px 2px 0;
    font-size:12px;
    opacity:.6;
    text-decoration:none;
  }
  .back:hover{ opacity:1; }

  /* ---------- menu a discesa mese / anno ---------- */
  .pickers{
    display:flex;
    gap:12px;
    margin: 26px 2px 0;
    flex-wrap:wrap;
  }
  .picker{
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:10px 38px 10px 18px;
    border-radius:100px;
    border:1px solid var(--line);
    background-color: var(--glass);
    color: var(--paper);
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23f3ede0' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position: right 16px center;
  }
  .picker:hover{ background-color: var(--glass-strong); }
  .picker option{ background:#0e1420; color:#f3ede0; }

  #archiveArea{ margin-top:28px; }

  @media (max-width: 760px){
    .page{ padding:16px 14px 44px; }
    .head{ grid-template-columns: 1fr; text-align:center; gap:8px; }
    .head-time{ text-align:center; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="head">
    <div class="head-name" id="headName">Caricamento…</div>
    <div class="head-data" id="headData">--</div>
    <div class="head-time"><b id="headTime">--:--:-- --/--/----</b></div>
  </div>

  <a class="back" id="backLink" href="gauges.html">&larr; Torna ai gauges</a>

  <div class="pickers">
    <select class="picker" id="monthPicker"></select>
    <select class="picker" id="yearPicker"></select>
  </div>

  <div id="archiveArea"></div>

</div>

<script>
/* =========================================
   STAZIONE DAL LINK (stessi parametri dei gauges)
   ?station=...&source=...&name=...
========================================= */

function normalizeSource(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

const params    = new URLSearchParams(window.location.search);
const stationId = params.get("station");
const network   = normalizeSource(params.get("source"));
const nameParam = params.get("name");

document.getElementById("backLink").href = "gauges.html" + window.location.search;


/* =========================================
   DATI ATTUALI: configurazione per rete
   t = temperatura, h = umidità, w = vento, d = direzione, r = pioggia
   (per ogni campo: nomi possibili, il primo presente vince)
========================================= */

const BASE = "https://api-stazioni-meteo.eggittof.workers.dev/";

const CFG = {
    omirl: {
        urls: [BASE + "omirl.json"],
        match: s => s.id,
        f: { t: ["temp"], h: ["hum"], w: ["windValue", "wind"], d: ["windDir"], r: ["rainDaily"] }
    },
    ignorete: {
        urls: [BASE + "ignorete.json"],
        match: s => s.id ?? s.name ?? s.N,
        f: { t: ["T", "temp"], h: ["H", "hum"], w: ["V", "windValue", "wind"], d: ["windDir", "VD"], r: ["R", "rainDaily"] }
    },
    limet: {
        urls: [BASE + "limet.json", BASE + "limet2.json"],
        match: s => s.N,
        f: { t: ["T"], h: ["H"], w: ["V"], d: [], r: ["R"] }
    },
    acronet: {
        urls: [BASE + "gepo.json"],
        match: s => s.id,
        f: { t: ["T"], h: ["H"], w: ["V"], d: ["VD"], r: ["R"] }
    },
    comunedigenova: {
        urls: [BASE + "comuneGenova.json"],
        match: s => s.id,
        f: { t: ["T"], h: ["H"], w: ["W"], d: ["WD"], r: ["R"] }
    },
    "3r": {
        urls: [BASE + "meteo3rpiemonte.json"],
        match: s => s.id,
        f: { t: ["T"], h: ["H"], w: ["V"], d: ["VD", "WD"], r: ["R"] }
    },
    dma: {
        urls: [BASE + "asti-test.json"],
        match: s => s.name,
        f: { t: ["T"], h: ["H"], w: ["V"], d: [], r: ["R"] }
    }
};

function toNum(v) {
    if (v === null || v === undefined || v === "") return null;
    const n = parseFloat(String(v).replace(",", "."));
    return Number.isFinite(n) ? n : null;
}

function pick(raw, keys) {
    for (const k of keys) {
        if (raw[k] !== undefined && raw[k] !== null && raw[k] !== "") return toNum(raw[k]);
    }
    return null;
}

const DIRS = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];

function dirLabel(deg) {
    return DIRS[Math.round(deg / 45) % 8];
}

let currentName = nameParam || stationId || "Stazione non trovata";

async function loadCurrent() {

    const cfg = CFG[network];

    if (!stationId || !cfg) {
        document.getElementById("headName").textContent = currentName;
        document.getElementById("headData").textContent = "--";
        return;
    }

    const wanted = String(stationId).trim().toLowerCase();

    try {

        let raw = null;

        for (const url of cfg.urls) {

            const res = await fetch(url + "?_=" + Date.now());
            if (!res.ok) continue;

            const json = await res.json();
            const list = Array.isArray(json) ? json : (json.stations || []);

            const matches = list.filter(s => s && String(cfg.match(s) ?? "").trim().toLowerCase() === wanted);

            // nomi doppi: preferisco la stazione che ha la temperatura
            raw = matches.find(s => pick(s, cfg.f.t) !== null) || matches[0] || null;

            if (raw) break;
        }

        if (!raw) throw new Error("stazione non trovata");

        // DMA: il titolo è il nome della stazione, non l'id
        if (network === "dma" && raw.name) currentName = raw.name;

        const t = pick(raw, cfg.f.t);
        const h = pick(raw, cfg.f.h);
        const w = pick(raw, cfg.f.w);
        const d = pick(raw, cfg.f.d);
        const r = pick(raw, cfg.f.r);

        const parts = [];

        if (t !== null) parts.push(t.toFixed(1) + "°c");
        if (h !== null) parts.push(Math.round(h) + "%");
        if (w !== null) parts.push(w.toFixed(1) + " km/h" + (d !== null ? " " + dirLabel(d) : ""));
        if (r !== null) parts.push(r.toFixed(1) + " mm");

        document.getElementById("headData").textContent = parts.length ? parts.join(" - ") : "--";

    } catch (err) {
        console.error("Dati attuali non disponibili:", err);
        document.getElementById("headData").textContent = "--";
    }

    document.getElementById("headName").textContent = currentName;
    document.title = currentName + " · Archivio";
}


/* =========================================
   OROLOGIO: 19:36:34 01/11/2026
========================================= */

function tickClock() {
    const now = new Date();
    document.getElementById("headTime").textContent =
        now.toLocaleTimeString("it-IT") + " " +
        now.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" });
}


/* =========================================
   MENU MESE / ANNO (si aprono sul mese e anno correnti)
========================================= */

const MONTHS = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
                "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];

const monthPicker = document.getElementById("monthPicker");
const yearPicker  = document.getElementById("yearPicker");

const today = new Date();

MONTHS.forEach(function (m, i) {
    const o = document.createElement("option");
    o.value = String(i + 1);
    o.textContent = m;
    monthPicker.appendChild(o);
});

for (let y = 2026; y <= Math.max(2026, today.getFullYear()); y++) {
    const o = document.createElement("option");
    o.value = String(y);
    o.textContent = String(y);
    yearPicker.appendChild(o);
}

monthPicker.value = String(today.getMonth() + 1);
yearPicker.value  = String(Math.max(2026, today.getFullYear()));

function onPickerChange() {
    // per ora nessun contenuto: qui verranno caricati i dati del mese scelto
    console.log("Archivio:", MONTHS[Number(monthPicker.value) - 1], yearPicker.value);
}

monthPicker.addEventListener("change", onPickerChange);
yearPicker.addEventListener("change", onPickerChange);


/* =========================================
   AVVIO
========================================= */

tickClock();
setInterval(tickClock, 1000);

loadCurrent();
setInterval(loadCurrent, 10 * 1000);
</script>
</body>
</html>
