<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1420;
    --page-bg:#0e1420;
    --paper:#f3ede0;
    --brass:#c99a4b;
    --glass: rgba(243,237,224,0.07);
    --glass-strong: rgba(243,237,224,0.13);
    --line: rgba(243,237,224,0.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    background-color: var(--page-bg);
    color: var(--paper);
    min-height:100vh;
    overflow-x:hidden;
  }

  .page{
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 22px 60px;
  }

  /* ---------- intestazione: nome | dati attuali | orario ---------- */
  .head{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:16px;
    padding: 4px 2px 20px;
    border-bottom:1px solid var(--line);
  }
  .head-name{
    font-weight:500;
    font-size:22px;
  }
  .head-data{
    font-size:18px;
    font-weight:500;
    text-align:center;
  }
  .head-time{
    font-size:13px;
    opacity:.75;
    text-align:right;
  }
  .head-time b{ font-weight:500; opacity:1; }

  .back{
    display:inline-block;
    margin: 14px 2px 0;
    color:#ffffff;
    font-size:16px;
    font-weight:500;
    letter-spacing:.04em;
    text-decoration:none;
    opacity:.85;
  }
  .back:hover{ opacity:1; }

  /* ---------- menu a discesa mese / anno ---------- */
  .pickers{
    display:flex;
    justify-content:center;
    gap:12px;
    margin: 26px 2px 0;
    flex-wrap:wrap;
  }
  /* stesso arancione dei pulsanti attivi dei grafici nei gauges (#e8a23a) */
  .picker{
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    font-weight:600;
    padding:10px 38px 10px 18px;
    border-radius:100px;
    border:1px solid #e8a23a;
    background-color: #e8a23a;
    color: var(--ink);
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%230e1420' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position: right 16px center;
  }
  .picker:hover{ filter:brightness(1.08); }
  .picker option{ background:#0e1420; color:#f3ede0; }

  #archiveArea{ margin-top:28px; }

  /* ---------- tabella dei giorni (stesso stile del riquadro Medie) ---------- */
  .averages-panel{
    background: var(--glass);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px 20px 20px;
  }
  /* più tabelle una sotto l'altra (vista annuale) */
  .averages-panel + .averages-panel{ margin-top:18px; }

  .panel-title{
    font-size:13px;
    font-weight:600;
    letter-spacing:.04em;
    opacity:.85;
    margin-bottom:14px;
  }

  .avg-grid{
    display:grid;
    grid-template-columns: 1fr repeat(4, 1.2fr);
    gap:8px 10px;
    align-items:center;
  }
  .avg-head{
    font-size:11px;
    letter-spacing:.07em;
    text-transform:uppercase;
    opacity:.5;
    text-align:center;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .avg-head.first{ text-align:left; }
  .avg-row-label{
    font-size:13px;
    font-weight:500;
    opacity:.85;
  }
  .avg-chip{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:7px 6px;
    border-radius:10px;
    font-weight:500;
    font-size:14px;
    background-color: rgba(14,20,32,0.5); /* grigio scuro al 50%: l'alone traspare */
    border:1px solid var(--line);
    color: var(--paper);
  }
  /* Il pannello grigio crea il proprio livello: l'alone (z-index -1) sta
     sopra lo sfondo grigio del pannello e sotto i riquadri scuri. */
  .averages-panel{ isolation:isolate; }
  .avg-chip{
    position:relative;
    overflow:visible;
  }
  .avg-chip::before{
    content:"";
    position:absolute;
    inset:-4px;
    border-radius:16px;
    background-color: var(--card-glow, transparent);
    filter: blur(9px);
    opacity:.5;
    z-index:-1;
    pointer-events:none;
  }
  .avg-chip.empty{ opacity:.45; }
  .avg-chip.empty::before{ display:none; }

  /* ---------- righe riepilogative / riquadri con etichetta in grigio ---------- */
  .avg-gap{
    grid-column:1 / -1;
    height:12px;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }
  .avg-row-label.sum{
    font-weight:600;
    opacity:1;
  }
  .avg-chip.sum{
    flex-direction:column;
    gap:2px;
    padding:9px 6px;
    text-align:center;
  }
  .avg-chip.sum small{
    font-size:10.5px;
    font-weight:400;
    opacity:.65;
    letter-spacing:.02em;
  }

  .note{
    margin-top:14px;
    font-size:12px;
    opacity:.55;
    text-align:center;
  }

  @media (max-width: 760px){
    .page{ padding:16px 14px 44px; }
    .head{ grid-template-columns: 1fr; text-align:center; gap:8px; }
    .head-time{ text-align:center; }
    .averages-panel{ padding:14px 12px 16px; }
    .avg-grid{ gap:6px 6px; }
    .avg-chip{ font-size:12px; padding:6px 3px; }
    .avg-chip.sum{ padding:7px 3px; }
    .avg-chip.sum small{ font-size:9.5px; }
    .avg-row-label{ font-size:11.5px; }
    .avg-head{ font-size:10px; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="head">
    <div class="head-name" id="headName">Caricamento…</div>
    <div class="head-data" id="headData">--</div>
    <div class="head-time"><b id="headTime">--:--:-- --/--/----</b></div>
  </div>

  <a class="back" id="backLink" href="gauges.html">&larr; Torna ai gauges</a>

  <div class="pickers">
    <select class="picker" id="monthPicker"></select>
    <select class="picker" id="yearPicker"></select>
  </div>

  <div id="archiveArea"></div>
  <div class="note" id="archiveNote"></div>

</div>

<script>
/* =========================================
   STAZIONE DAL LINK (stessi parametri dei gauges)
   ?station=...&source=...&name=...
========================================= */

function normalizeSource(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}

const params    = new URLSearchParams(window.location.search);
const stationId = params.get("station");
const network   = normalizeSource(params.get("source"));
const nameParam = params.get("name");

document.getElementById("backLink").href = "gauges.html" + window.location.search;


/* =========================================
   DATI ATTUALI: configurazione per rete
   t = temperatura, h = umidità, w = vento, d = direzione, r = pioggia
   (per ogni campo: nomi possibili, il primo presente vince)

   arc.t / arc.r = nomi delle serie su archivio-eventi
   (temperature "<fonte>_T", pioggia "<fonte>"; per OMIRL il cumulato "omirlcum")
========================================= */

const BASE = "https://api-stazioni-meteo.eggittof.workers.dev/";
const ARCHIVE_BASE = "https://archivio-eventi.eggittof.workers.dev";

const CFG = {
    omirl: {
        urls: [BASE + "omirl.json"],
        match: s => s.id,
        f: { t: ["temp"], h: ["hum"], w: ["windValue", "wind"], d: ["windDir"], r: ["rainDaily"] },
        arc: { t: ["omirl_T"], r: ["omirlcum"] }
    },
    ignorete: {
        urls: [BASE + "ignorete.json"],
        match: s => s.id ?? s.name ?? s.N,
        f: { t: ["T", "temp"], h: ["H", "hum"], w: ["V", "windValue", "wind"], d: ["windDir", "VD"], r: ["R", "rainDaily"] },
        arc: { t: ["ignorete_T"], r: ["ignorete"] }
    },
    limet: {
        urls: [BASE + "limet.json", BASE + "limet2.json"],
        match: s => s.N,
        f: { t: ["T"], h: ["H"], w: ["V"], d: [], r: ["R"] },
        arc: { t: ["limet1_T", "limet2_T"], r: ["limet1", "limet2"] }
    },
    acronet: {
        urls: [BASE + "gepo.json"],
        match: s => s.id,
        f: { t: ["T"], h: ["H"], w: ["V"], d: ["VD"], r: ["R"] },
        arc: { t: ["gepo_T"], r: ["gepo"] }
    },
    comunedigenova: {
        urls: [BASE + "comuneGenova.json"],
        match: s => s.id,
        f: { t: ["T"], h: ["H"], w: ["W"], d: ["WD"], r: ["R"] },
        arc: { t: ["comuneGenova_T"], r: ["comuneGenova"] }
    },
    "3r": {
        urls: [BASE + "meteo3rpiemonte.json"],
        match: s => s.id,
        f: { t: ["T"], h: ["H"], w: ["V"], d: ["VD", "WD"], r: ["R"] },
        arc: { t: ["3r_T"], r: [] }
    },
    dma: {
        urls: [BASE + "asti-test.json"],
        match: s => s.name,
        f: { t: ["T"], h: ["H"], w: ["V"], d: [], r: ["R"] },
        arc: { t: ["dma_T"], r: ["dma"] }
    }
};

function toNum(v) {
    if (v === null || v === undefined || v === "") return null;
    const n = parseFloat(String(v).replace(",", "."));
    return Number.isFinite(n) ? n : null;
}

function pick(raw, keys) {
    for (const k of keys) {
        if (raw[k] !== undefined && raw[k] !== null && raw[k] !== "") return toNum(raw[k]);
    }
    return null;
}

const DIRS = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];

function dirLabel(deg) {
    return DIRS[Math.round(deg / 45) % 8];
}

// un giorno è "di pioggia" se sono caduti almeno 1.0 mm
const RAIN_DAY_MM = 1.0;

let currentName = nameParam || stationId || "Stazione non trovata";

// id con cui la stazione potrebbe essere salvata nell'archivio
// (di solito è lo stesso del link; per DMA è l'id/MAC, non il nome)
let archiveIds = stationId ? [String(stationId).trim()] : [];

// ultima lettura della stazione (serve per max/min di OMIRL)
let currentRaw = null;

function collectArchiveIds(raw) {
    const list = [];
    const add = v => {
        if (v === undefined || v === null || v === "") return;
        const s = String(v).trim();
        if (s && !list.includes(s)) list.push(s);
    };

    if (network === "dma") add(raw.id);
    add(stationId);
    add(raw.id);
    add(raw.code);
    add(raw.shortCode);
    add(raw.name);
    add(raw.N);

    archiveIds = list;
}

async function loadCurrent() {

    const cfg = CFG[network];

    if (!stationId || !cfg) {
        document.getElementById("headName").textContent = currentName;
        document.getElementById("headData").textContent = "--";
        return;
    }

    const wanted = String(stationId).trim().toLowerCase();

    try {

        let raw = null;

        for (const url of cfg.urls) {

            const res = await fetch(url + "?_=" + Date.now());
            if (!res.ok) continue;

            const json = await res.json();
            const list = Array.isArray(json) ? json : (json.stations || []);

            const matches = list.filter(s => s && String(cfg.match(s) ?? "").trim().toLowerCase() === wanted);

            // nomi doppi: preferisco la stazione che ha la temperatura
            raw = matches.find(s => pick(s, cfg.f.t) !== null) || matches[0] || null;

            if (raw) break;
        }

        if (!raw) throw new Error("stazione non trovata");

        collectArchiveIds(raw);
        currentRaw = raw;

        // DMA: il titolo è il nome della stazione, non l'id
        if (network === "dma" && raw.name) currentName = raw.name;

        const t = pick(raw, cfg.f.t);
        const h = pick(raw, cfg.f.h);
        const w = pick(raw, cfg.f.w);
        const d = pick(raw, cfg.f.d);
        const r = pick(raw, cfg.f.r);

        const parts = [];

        if (t !== null) parts.push(t.toFixed(1) + "°c");
        if (h !== null) parts.push(Math.round(h) + "%");
        if (w !== null) parts.push(w.toFixed(1) + " km/h" + (d !== null ? " " + dirLabel(d) : ""));
        if (r !== null) parts.push(r.toFixed(1) + " mm");

        document.getElementById("headData").textContent = parts.length ? parts.join(" - ") : "--";

    } catch (err) {
        console.error("Dati attuali non disponibili:", err);
        document.getElementById("headData").textContent = "--";
    }

    document.getElementById("headName").textContent = currentName;
    document.title = currentName + " · Archivio";
}


/* =========================================
   OROLOGIO: 19:36:34 01/11/2026
========================================= */

function tickClock() {
    const now = new Date();
    document.getElementById("headTime").textContent =
        now.toLocaleTimeString("it-IT") + " " +
        now.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric" });
}


/* =========================================
   MENU MESE / ANNO (si aprono sul mese e anno correnti)
   Dopo Dicembre c'è la voce "Anno" (value "0"): vista annuale.
========================================= */

const MONTHS = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
                "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];

const monthPicker = document.getElementById("monthPicker");
const yearPicker  = document.getElementById("yearPicker");

const today = new Date();

MONTHS.forEach(function (m, i) {
    const o = document.createElement("option");
    o.value = String(i + 1);
    o.textContent = m;
    monthPicker.appendChild(o);
});

(function () {
    const o = document.createElement("option");
    o.value = "0";
    o.textContent = "Anno";
    monthPicker.appendChild(o);
})();

for (let y = Math.max(2026, today.getFullYear()); y >= 2002; y--) {
    const o = document.createElement("option");
    o.value = String(y);
    o.textContent = String(y);
    yearPicker.appendChild(o);
}

monthPicker.value = String(today.getMonth() + 1);
yearPicker.value  = String(Math.max(2026, today.getFullYear()));

function isYearMode() {
    return monthPicker.value === "0";
}


/* =========================================
   COLORI DELLE SCALE (gli stessi dei gauges)
========================================= */

function getTempColor(value){
  if (value < -15) return "#f54dff";
  if (value < -10) return "#c65bff";
  if (value < -4) return "#4d54ff";
  if (value < -2) return "#1f7eb9";
  if (value <= 0) return "#539eb0";
  if (value < 2) return "#67bac8";
  if (value < 4) return "#5ac5ba";
  if (value < 6) return "#42a37b";
  if (value < 8) return "#538b53";
  if (value < 10) return "#419a41";
  if (value < 12) return "#5cb425";
  if (value < 14) return "#76ca38";
  if (value < 16) return "#a1d950";
  if (value < 18) return "#eadf00";
  if (value < 20) return "#ffcc55";
  if (value < 22) return "#ffaf54";
  if (value < 24) return "#fa8f4b";
  if (value < 26) return "#f26969";
  if (value < 28) return "#de5a5a";
  if (value < 30) return "#b05151";
  if (value < 32) return "#994848";
  if (value < 34) return "#743e3e";
  if (value < 36) return "#b874ac";
  if (value < 38) return "#ea7bea";
  return "#995a99";
}

function getRainScaleColor(v){
  if (v === 0) return "#808080";
  if (v < 2) return "#f9ae6c";
  if (v < 5) return "#f9966c";
  if (v < 10) return "#6ca561";
  if (v < 20) return "#65d050";
  if (v < 30) return "#4dc8ff";
  if (v < 50) return "#4da9ff";
  return "#2c278e";
}

// colore dell'alone in base al campo e al valore (l'asterisco della media si ignora)
function glowColor(field, text) {
    const n = parseFloat(String(text).replace(",", "."));

    if (!Number.isFinite(n)) return null;

    return field === "rain" ? getRainScaleColor(n) : getTempColor(n);
}


/* =========================================
   ARCHIVIO: dati da archivio-eventi

   /archivio?src=<serie>&mese=MMYY&st=<stazione>
     serie temperatura (<fonte>_T): "TMAX, TMED, TMIN" per ogni giorno
     serie pioggia (<fonte>)      : un valore per giorno

   Se il giorno di oggi non è ancora in archivio (viene scritto a fine
   giornata), max/min/media/pioggia si calcolano dalle righe al minuto di
   /export?src=...&from=<mezzanotte di oggi>.
========================================= */

async function getJson(url) {
    const res = await fetch(url);

    if (!res.ok) throw new Error("HTTP " + res.status);

    return res.json();
}

// Cerca la stazione (provando gli id candidati) nelle serie indicate:
// restituisce { arr, src, id } della prima serie che ha dati
async function fetchArchiveSeries(srcs, mese) {
    for (const src of srcs) {
        for (const id of archiveIds) {
            try {
                const data = await getJson(
                    ARCHIVE_BASE + "/archivio?src=" + encodeURIComponent(src) +
                    "&mese=" + mese + "&st=" + encodeURIComponent(id)
                );

                const str = data.stations && data.stations[id];

                if (str) return { arr: str.split(",").map(s => s.trim()), src, id };
            } catch (err) {
                console.warn("Archivio non disponibile per", src, id, err);
            }
        }
    }

    return null;
}

// Righe al minuto di oggi per una stazione: restituisce l'array dei valori numerici
const EXCLUDED_TEMPS = ["-44.9", "-17.8"];

async function fetchTodayValues(srcs, fromIso, isTemp) {
    for (const src of srcs) {
        try {
            const data = await getJson(
                ARCHIVE_BASE + "/export?src=" + encodeURIComponent(src) +
                "&from=" + encodeURIComponent(fromIso) + "&limit=2000"
            );

            const ids = data.stations || [];
            let idx = -1;

            for (const id of archiveIds) {
                idx = ids.indexOf(id);
                if (idx >= 0) break;
            }

            if (idx < 0) continue;

            const values = [];

            for (const row of data.rows || []) {
                const v = toNum(String(row[1]).split(",")[idx]);

                if (v === null) continue;

                // temperature errate da escludere (come nell'archivio)
                if (isTemp && EXCLUDED_TEMPS.indexOf(v.toFixed(1)) >= 0) continue;

                values.push(v);
            }

            if (values.length) return values;
        } catch (err) {
            console.warn("Export non disponibile per", src, err);
        }
    }

    return null;
}

/* Dati di un mese: per ogni campo un array (indice = giorno - 1) di testi
   (es. "12.3", la media può avere l'asterisco) oppure null se manca.
   Per il mese in corso il giorno di oggi viene completato dai dati al minuto. */
async function fetchMonthData(month, year) {

    const cfg  = CFG[network];
    const days = new Date(year, month, 0).getDate();

    const out = {
        has:   false,
        tmax:  new Array(days).fill(null),
        tmin:  new Array(days).fill(null),
        tmean: new Array(days).fill(null),
        rain:  new Array(days).fill(null)
    };

    if (!cfg || !archiveIds.length) return out;

    const mese = String(month).padStart(2, "0") + String(year).slice(2);

    const [tempRes, rainRes] = await Promise.all([
        fetchArchiveSeries(cfg.arc.t, mese),
        fetchArchiveSeries(cfg.arc.r, mese)
    ]);

    out.has = !!(tempRes || rainRes);

    // temperatura: 3 valori per giorno (TMAX, TMED, TMIN)
    if (tempRes) {
        const a = tempRes.arr;

        for (let d = 1; d <= a.length / 3 && d <= days; d++) {
            const tmax = a[(d - 1) * 3];
            const tmed = a[(d - 1) * 3 + 1];
            const tmin = a[(d - 1) * 3 + 2];

            if (tmax) out.tmax[d - 1]  = tmax;
            if (tmin) out.tmin[d - 1]  = tmin;
            if (tmed) out.tmean[d - 1] = tmed; // l'asterisco = pochi campioni
        }
    }

    // pioggia: 1 valore per giorno
    if (rainRes) {
        rainRes.arr.forEach(function (v, i) {
            if (v !== "" && i < days) out.rain[i] = v;
        });
    }

    // giorno attuale ancora vuoto: uso i dati correnti di archivio-eventi
    const now = new Date();

    if (now.getFullYear() === year && now.getMonth() + 1 === month) {

        const day = now.getDate();

        const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const fromIso = midnight.toISOString().slice(0, 19) + "Z";

        const needTemp = out.tmax[day - 1] === null || out.tmin[day - 1] === null;
        const needRain = out.rain[day - 1] === null;

        const [tv, rv] = await Promise.all([
            needTemp ? fetchTodayValues(cfg.arc.t, fromIso, true) : null,
            needRain && cfg.arc.r.length ? fetchTodayValues(cfg.arc.r, fromIso) : null
        ]);

        if (tv || (network === "omirl" && currentRaw)) {
            // OMIRL: massima e minima le dà la stazione (tempHigh / tempLow)
            const okT = v => v !== null && EXCLUDED_TEMPS.indexOf(v.toFixed(1)) < 0;
            const hMax = network === "omirl" && currentRaw ? toNum(currentRaw.tempHigh) : null;
            const hMin = network === "omirl" && currentRaw ? toNum(currentRaw.tempLow) : null;

            const max  = okT(hMax) ? hMax : (tv ? Math.max.apply(null, tv) : null);
            const min  = okT(hMin) ? hMin : (tv ? Math.min.apply(null, tv) : null);
            const mean = tv ? tv.reduce((a, b) => a + b, 0) / tv.length : null;

            if (max !== null && out.tmax[day - 1] === null)   out.tmax[day - 1]  = max.toFixed(1);
            if (min !== null && out.tmin[day - 1] === null)   out.tmin[day - 1]  = min.toFixed(1);
            if (mean !== null && out.tmean[day - 1] === null) out.tmean[day - 1] = mean.toFixed(1);
        }

        if (rv) {
            out.rain[day - 1] = Math.max.apply(null, rv).toFixed(1);
        }
    }

    return out;
}


/* =========================================
   FUNZIONI COMUNI PER I RIEPILOGHI
========================================= */

// [{ day, month, v }] dai testi di un mese
function numList(arr, month) {
    const out = [];

    arr.forEach(function (s, i) {
        const n = toNum(s);

        if (n !== null) out.push({ day: i + 1, month: month, v: n });
    });

    return out;
}

function extreme(list, wantMax) {
    let best = null;

    list.forEach(function (o) {
        if (best === null || (wantMax ? o.v > best.v : o.v < best.v)) best = o;
    });

    return best;
}

function avgOf(list) {
    return list.reduce(function (a, o) { return a + o.v; }, 0) / list.length;
}

function sumOf(list) {
    return list.reduce(function (a, o) { return a + o.v; }, 0);
}

function rainyDays(list) {
    return list.filter(function (o) { return o.v >= RAIN_DAY_MM; }).length;
}

function fmtDM(o) {
    return String(o.day).padStart(2, "0") + "/" + String(o.month).padStart(2, "0");
}

// scrive un riquadro: valore, etichetta grigia sotto, alone colorato
function paintChip(el, text, sub, glow) {
    if (!el) return;

    el.innerHTML = text + (sub ? "<small>" + sub + "</small>" : "");
    el.classList.remove("empty");

    if (glow) el.style.setProperty("--card-glow", glow);
    else el.style.removeProperty("--card-glow");
}


/* =========================================
   VISTA MENSILE: tabella dei giorni + 3 righe riepilogative
     avg = medie mensili e accumulo di pioggia
     max = estremi (ext. max. per massima e media, ext. min. per minima; pioggia: ext. max.)
     min = estremi inversi (ext. min. per massima e media, ext. max. per minima; pioggia: giorni di pioggia)
========================================= */

function buildTable() {

    const month = Number(monthPicker.value);
    const year  = Number(yearPicker.value);

    const days = new Date(year, month, 0).getDate();

    let html =
        '<div class="averages-panel"><div class="avg-grid">' +
        '<span class="avg-head first">Giorno</span>' +
        '<span class="avg-head">Temp. massima</span>' +
        '<span class="avg-head">Temp. minima</span>' +
        '<span class="avg-head">Temp. media</span>' +
        '<span class="avg-head">Pioggia</span>';

    for (let d = 1; d <= days; d++) {
        html +=
            '<span class="avg-row-label">' + d + '</span>' +
            '<span class="avg-chip empty" data-day="' + d + '" data-field="tmax">--°</span>' +
            '<span class="avg-chip empty" data-day="' + d + '" data-field="tmin">--°</span>' +
            '<span class="avg-chip empty" data-day="' + d + '" data-field="tmean">--°</span>' +
            '<span class="avg-chip empty" data-day="' + d + '" data-field="rain">-- mm</span>';
    }

    html +=
        '<div class="avg-gap"></div>' +
        '<span class="avg-head first"></span>' +
        '<span class="avg-head">Massima</span>' +
        '<span class="avg-head">Minima</span>' +
        '<span class="avg-head">Media</span>' +
        '<span class="avg-head">Accumulo</span>';

    const sumRows = [
        { key: "avg", label: "Medie mensili", units: ["--°", "--°", "--°", "-- mm"] },
        { key: "max", label: "Estremi",       units: ["--°", "--°", "--°", "-- mm"] },
        { key: "min", label: "Altri estremi", units: ["--°", "--°", "--°", "--"] }
    ];

    sumRows.forEach(function (row) {
        html += '<span class="avg-row-label sum">' + row.label + '</span>';

        ["tmax", "tmin", "tmean", "rain"].forEach(function (f, i) {
            html += '<span class="avg-chip sum empty" data-sum="' + row.key + '-' + f + '">' + row.units[i] + '</span>';
        });
    });

    html += '</div></div>';

    document.getElementById("archiveArea").innerHTML = html;
}

function setChip(day, field, text) {
    const el = document.querySelector('.avg-chip[data-day="' + day + '"][data-field="' + field + '"]');

    if (!el) return;

    el.textContent = text;
    el.classList.remove("empty");

    const color = glowColor(field, text);

    if (color) el.style.setProperty("--card-glow", color);
}

// valori numerici già presenti in tabella per un campo: [{ day, month, v }]
function readField(field) {
    const out = [];
    const month = Number(monthPicker.value);

    document.querySelectorAll('.avg-chip[data-field="' + field + '"]:not(.empty)').forEach(function (el) {
        const n = parseFloat(el.textContent.replace(",", "."));

        if (Number.isFinite(n)) out.push({ day: Number(el.dataset.day), month: month, v: n });
    });

    return out;
}

function setSum(key, field, text, sub, glow) {
    paintChip(document.querySelector('.avg-chip[data-sum="' + key + '-' + field + '"]'), text, sub, glow);
}

function updateSummary() {

    ["tmax", "tmin", "tmean"].forEach(function (f) {
        const list = readField(f);

        if (!list.length) return;

        // medie mensili
        const mean = avgOf(list);
        setSum("avg", f, mean.toFixed(1) + "°", "media mensile", getTempColor(mean));

        // seconda riga (estremi): ext. max. per massima e media, ext. min. per minima
        const wantMax2 = (f !== "tmin");
        const e2 = extreme(list, wantMax2);
        setSum("max", f, e2.v.toFixed(1) + "°",
               (wantMax2 ? "ext. max." : "ext. min.") + " · " + fmtDM(e2), getTempColor(e2.v));

        // terza riga: ext. min. per massima e media, ext. max. per minima
        const wantMax3 = (f === "tmin");
        const e3 = extreme(list, wantMax3);
        setSum("min", f, e3.v.toFixed(1) + "°",
               (wantMax3 ? "ext. max." : "ext. min.") + " · " + fmtDM(e3), getTempColor(e3.v));
    });

    const rain = readField("rain");

    if (rain.length) {
        // accumulo mensile
        const tot = sumOf(rain);
        setSum("avg", "rain", tot.toFixed(1) + " mm", "accumulo mensile", getRainScaleColor(tot));

        // giorno più piovoso (con data)
        const top = extreme(rain, true);

        if (top.v > 0) setSum("max", "rain", top.v.toFixed(1) + " mm", "ext. max. · " + fmtDM(top), getRainScaleColor(top.v));
        else setSum("max", "rain", "0.0 mm", "ext. max.", getRainScaleColor(0));

        // giorni di pioggia (>= 1.0 mm)
        setSum("min", "rain", String(rainyDays(rain)), "giorni di pioggia", null);
    }
}

let loadToken = 0;

async function loadArchive() {

    const token = ++loadToken;

    const note = document.getElementById("archiveNote");
    note.textContent = "";

    const cfg = CFG[network];

    if (!cfg || !archiveIds.length) return;

    const month = Number(monthPicker.value);
    const year  = Number(yearPicker.value);

    const data = await fetchMonthData(month, year);

    // nel frattempo l'utente ha cambiato mese/anno
    if (token !== loadToken) return;

    const days = data.tmax.length;

    for (let d = 1; d <= days; d++) {
        if (data.tmax[d - 1]  !== null) setChip(d, "tmax",  data.tmax[d - 1]  + "°");
        if (data.tmin[d - 1]  !== null) setChip(d, "tmin",  data.tmin[d - 1]  + "°");
        if (data.tmean[d - 1] !== null) setChip(d, "tmean", data.tmean[d - 1] + "°");
        if (data.rain[d - 1]  !== null) setChip(d, "rain",  data.rain[d - 1]  + " mm");
    }

    // righe riepilogative (dopo che tutti i giorni, oggi compreso, sono stati scritti)
    updateSummary();

    if (!data.has) {
        note.textContent = "Nessun dato in archivio per questo mese.";
    }
}


/* =========================================
   VISTA ANNUALE ("Anno" nel menu dei mesi): 3 tabelle
     1) medie mensili di temperatura e accumulo di pioggia mensile
     2) estremi mensili (ext. max. massima e media, ext. min. minima, pioggia ext. max.)
     3) estremi inversi (ext. min. massima e media, ext. max. minima) e giorni di pioggia
   In fondo a ognuna la riga dei valori annui.
========================================= */

const YEAR_TABLES = [
    { n: 1, title: "Medie mensili e accumulo di pioggia",    rainHead: "Pioggia",           rainEmpty: "-- mm" },
    { n: 2, title: "Estremi mensili",                         rainHead: "Pioggia",           rainEmpty: "-- mm" },
    { n: 3, title: "Estremi inversi e giorni di pioggia",     rainHead: "Giorni di pioggia", rainEmpty: "--" }
];

function buildYear() {

    let html = "";

    YEAR_TABLES.forEach(function (t) {

        html +=
            '<div class="averages-panel"><div class="panel-title">' + t.title + '</div><div class="avg-grid">' +
            '<span class="avg-head first">Mese</span>' +
            '<span class="avg-head">Temp. massima</span>' +
            '<span class="avg-head">Temp. minima</span>' +
            '<span class="avg-head">Temp. media</span>' +
            '<span class="avg-head">' + t.rainHead + '</span>';

        const rowHtml = function (key, label, isTotal) {
            let h = '<span class="avg-row-label' + (isTotal ? ' sum' : '') + '">' + label + '</span>';

            ["tmax", "tmin", "tmean", "rain"].forEach(function (f) {
                h += '<span class="avg-chip sum empty" data-y="' + t.n + '-' + key + '-' + f + '">' +
                     (f === "rain" ? t.rainEmpty : "--°") + '</span>';
            });

            return h;
        };

        for (let m = 1; m <= 12; m++) html += rowHtml(String(m), MONTHS[m - 1], false);

        html += '<div class="avg-gap"></div>';
        html += rowHtml("T", "Anno", true);

        html += '</div></div>';
    });

    document.getElementById("archiveArea").innerHTML = html;
}

function setYear(table, key, field, text, sub, glow) {
    paintChip(document.querySelector('.avg-chip[data-y="' + table + '-' + key + '-' + field + '"]'), text, sub, glow);
}

// riempie la riga di un mese (key "1".."12") o la riga annua (key "T") nelle 3 tabelle
function fillYearRow(key, L, isYear) {

    const meanLbl = isYear ? "media annua"    : "media mensile";
    const accLbl  = isYear ? "accumulo annuo" : "accumulo mensile";
    const extTag  = isYear ? " annuo" : "";

    ["tmax", "tmin", "tmean"].forEach(function (f) {
        const list = L[f];

        if (!list.length) return;

        // tabella 1: medie
        const mean = avgOf(list);
        setYear(1, key, f, mean.toFixed(1) + "°", meanLbl, getTempColor(mean));

        // tabella 2: ext. max. per massima e media, ext. min. per minima
        const wantMax2 = (f !== "tmin");
        const e2 = extreme(list, wantMax2);
        setYear(2, key, f, e2.v.toFixed(1) + "°",
                (wantMax2 ? "ext. max." : "ext. min.") + extTag + " · " + fmtDM(e2), getTempColor(e2.v));

        // tabella 3: ext. min. per massima e media, ext. max. per minima
        const wantMax3 = (f === "tmin");
        const e3 = extreme(list, wantMax3);
        setYear(3, key, f, e3.v.toFixed(1) + "°",
                (wantMax3 ? "ext. max." : "ext. min.") + extTag + " · " + fmtDM(e3), getTempColor(e3.v));
    });

    const rain = L.rain;

    if (rain.length) {
        // tabella 1: accumulo
        const tot = sumOf(rain);
        setYear(1, key, "rain", tot.toFixed(1) + " mm", accLbl, getRainScaleColor(tot));

        // tabella 2: giorno più piovoso
        const top = extreme(rain, true);

        if (top.v > 0) setYear(2, key, "rain", top.v.toFixed(1) + " mm", "ext. max." + extTag + " · " + fmtDM(top), getRainScaleColor(top.v));
        else setYear(2, key, "rain", "0.0 mm", "ext. max." + extTag, getRainScaleColor(0));

        // tabella 3: giorni di pioggia (>= 1.0 mm)
        setYear(3, key, "rain", String(rainyDays(rain)), isYear ? "giorni di pioggia annui" : "giorni di pioggia", null);
    }
}

function fillYear(months) {

    const all = { tmax: [], tmin: [], tmean: [], rain: [] };

    months.forEach(function (md, i) {
        const m = i + 1;
        const L = {};

        ["tmax", "tmin", "tmean", "rain"].forEach(function (f) {
            L[f]   = numList(md[f], m);
            all[f] = all[f].concat(L[f]);
        });

        fillYearRow(String(m), L, false);
    });

    // riga annua: medie calcolate su tutti i giorni dell'anno, estremi e totali dell'anno
    fillYearRow("T", all, true);
}

async function loadYear() {

    const token = ++loadToken;

    const note = document.getElementById("archiveNote");
    note.textContent = "";

    const cfg = CFG[network];

    if (!cfg || !archiveIds.length) return;

    const year = Number(yearPicker.value);
    const now  = new Date();

    note.textContent = "Caricamento dell'anno…";

    const empty = function (m) {
        const days = new Date(year, m, 0).getDate();

        return {
            has: false,
            tmax:  new Array(days).fill(null),
            tmin:  new Array(days).fill(null),
            tmean: new Array(days).fill(null),
            rain:  new Array(days).fill(null)
        };
    };

    const months = await Promise.all(
        MONTHS.map(function (_, i) {
            const m = i + 1;

            // mesi futuri dell'anno in corso: niente da cercare
            if (year === now.getFullYear() && m > now.getMonth() + 1) return Promise.resolve(empty(m));

            return fetchMonthData(m, year);
        })
    );

    // nel frattempo l'utente ha cambiato mese/anno
    if (token !== loadToken) return;

    note.textContent = "";

    fillYear(months);

    if (!months.some(function (x) { return x.has; })) {
        note.textContent = "Nessun dato in archivio per questo anno.";
    }
}


/* =========================================
   SCELTA DELLA VISTA (mese / anno)
========================================= */

function buildView() {
    if (isYearMode()) buildYear();
    else buildTable();
}

function loadView() {
    if (isYearMode()) loadYear();
    else loadArchive();
}

function onPickerChange() {
    buildView();
    loadView();
}

monthPicker.addEventListener("change", onPickerChange);
yearPicker.addEventListener("change", onPickerChange);


/* =========================================
   AVVIO
========================================= */

buildView();

tickClock();
setInterval(tickClock, 1000);

// prima i dati attuali (servono gli id della stazione), poi l'archivio
loadCurrent().then(loadView);
setInterval(loadCurrent, 10 * 1000);
</script>
