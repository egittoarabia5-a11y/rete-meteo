<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stazione Meteo</title>

  <!-- Font Inter -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;

      font-family: "Inter", sans-serif;
    }

    /* =========================
       FOTO FULL SCREEN
       ========================= */

    main {
      width: 100vw;
      height: 100vh;

      margin: 0;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    #stationImage {
      width: 100vw;
      height: 100vh;

      display: block;

      object-fit: contain;

      border: 0;
      border-radius: 0;
    }


    /* =========================
       BARRA SUPERIORE
       ========================= */

    #stationBar {

      position: fixed;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 10;

      /*
        Larghezza quasi completa,
        ma con margini laterali.
      */
      width: calc(100% - 36px);

      min-height: 58px;

      padding: 14px 26px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 999px;

      /*
        Effetto vetro / metallo
        stile iPhone
      */
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.38),
          rgba(255,255,255,0.16) 45%,
          rgba(255,255,255,0.10)
        );

      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);

      border: 1px solid rgba(255,255,255,0.35);

      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.45),
        inset 0 -1px 1px rgba(0,0,0,0.12),
        0 8px 30px rgba(0,0,0,0.25);

      color: white;

      text-align: center;

      white-space: nowrap;

      overflow: hidden;

      /*
        Leggera trasparenza generale
      */
      opacity: 0.96;
    }


    #stationName {

      font-size: 22px;

      font-weight: 600;

      letter-spacing: -0.25px;

      line-height: 1.2;

      text-shadow:
        0 1px 3px rgba(0,0,0,0.45);

      overflow: hidden;

      text-overflow: ellipsis;
    }


/* ========================= DASHBOARD A SINISTRA ========================= */ 
#dashboard 
{ position: fixed; 
  top: 92px; 
  left: 18px; 
  width: 25vw; 
  height: calc(100vh - 110px); 
  z-index: 9; 
  padding: 24px; 
  border-radius: 30px; 
  background: linear-gradient( 135deg, rgba(255,255,255,0.38), rgba(255,255,255,0.16) 45%, rgba(255,255,255,0.10) ); 
  backdrop-filter: blur(22px) saturate(160%); 
  -webkit-backdrop-filter: blur(22px) saturate(160%); 
  border: 1px solid rgba(255,255,255,0.35); 
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.45), inset 0 -1px 1px rgba(0,0,0,0.12), 0 8px 30px rgba(0,0,0,0.25); 
  color: white; 
  overflow: hidden; } 

  #dashboardTitle 
  { font-size: 18px; 
    font-weight: 600; 
    margin-bottom: 20px; 
    text-shadow: 0 1px 3px rgba(0,0,0,0.45); }
     /* ========================= ERRORE ========================= */ 
     #error { display: none; 
      position: fixed; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      padding: 25px; 
      max-width: 90%; 
      background: white; 
      border-radius: 16px; 
      color: #a00000; 
      text-align: center; 
      font-family: "Inter", sans-serif; 
      box-shadow: 0 5px 30px rgba(0,0,0,0.4); 
      z-index: 20; } 
      /* ========================= MOBILE ========================= */ @media (max-width: 600px) { #stationBar { top: 12px; width: calc(100% - 24px); min-height: 50px; padding: 12px 20px; } #stationName { font-size: 14px; } #dashboard { top: 74px; left: 12px; width: calc(100% - 24px); height: 300px; border-radius: 24px; } }
  </style>
</head>

<body>

  <main>

    <!-- =========================
         BARRA
         ========================= -->

    <div id="stationBar">

      <div id="stationName"></div>

    </div>


    <!-- =========================
         ERRORE
         ========================= -->

    <div id="error"></div>


    <!-- =========================
         FOTO
         ========================= -->

    <img
      id="stationImage"
      src=""
      alt="Immagine stazione"
    >

  </main>


  <script>

    // =========================
    // CONFIGURAZIONE STAZIONI
    // =========================

    const stationPhotos = {

      "IGENOA2897": {
        name: "Genova San Martino - Fonte: Wunderground - Altitudine: 104 m.s.l.m.",
        photo: "SanMartino1.png"
      },      
      "IGENOA3052": {
        name: "Genova Boccadasse - Fonte: Wunderground - Altitudine: 41 m.s.l.m.",
        photo: "Boccadasse1.png"
      },      
      "IGENOA3085": {
        name: "Genova Sturla - Fonte: Wunderground - Altitudine: 74 m.s.l.m.",
        photo: "Sturla1.jpg"
      }

      // =========================
      // ALTRE STAZIONI
      // =========================

      // "IGENOA1234": {
      //
      //   name: "Genova Brignole - Fonte: Wunderground",
      //
      //   photo: "Brignole.png"
      //
      // },

      // "IGENOA5678": {
      //
      //   name: "Genova Nervi - Fonte: Wunderground",
      //
      //   photo: "Nervi.png"
      //
      // }

    };


    // =========================
    // LEGGE URL
    // =========================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const station =
      params.get("station");


    // =========================
    // ELEMENTI
    // =========================

    const image =
      document.getElementById(
        "stationImage"
      );

    const bar =
      document.getElementById(
        "stationBar"
      );

    const stationName =
      document.getElementById(
        "stationName"
      );

    const error =
      document.getElementById(
        "error"
      );


    // =========================
    // MOSTRA STAZIONE
    // =========================

    if (
      !station ||
      !stationPhotos[station]
    ) {

      image.style.display =
        "none";

      bar.style.display =
        "none";

      error.style.display =
        "block";

      error.textContent =
        station
          ? `Stazione "${station}" non configurata.`
          : "Nessuna stazione specificata.";

    } else {

      const data =
        stationPhotos[station];


      // =========================
      // NOME
      // =========================

      stationName.textContent =
        data.name;


      // =========================
      // FOTO
      // =========================

      image.src =
        data.photo;

      image.alt =
        data.name;


      // =========================
      // ERRORE IMMAGINE
      // =========================

      image.onerror = () => {

        image.style.display =
          "none";

        bar.style.display =
          "none";

        error.style.display =
          "block";

        error.textContent =
          `Impossibile trovare "${data.photo}".`;

      };

    }

  </script>

</body>
</html>
