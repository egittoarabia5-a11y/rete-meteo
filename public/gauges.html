    // La scala deve essere SEMPRE di 60°C

// =========================================
// FUNZIONE AGGIORNAMENTO
// =========================================

function updateTemperatureGauge(
    value,
    minValue,
    maxValue
) {

    // =========================================
    // AGGIORNA MINIMO REALE
    // =========================================

    if (minValue < temperatureMin) {

        temperatureMin = minValue;

    }


    // =========================================
    // AGGIORNA MASSIMO REALE
    // =========================================

    if (maxValue > temperatureMax) {

        temperatureMax = maxValue;

    }


    // =========================================
    // RICALCOLA LA SCALA
    // =========================================

    const oldTempMin = tempMin;
    const oldTempMax = tempMax;

    updateTemperatureScale();


    // =========================================
    // AGGIORNA LA SCALA SOLO SE NECESSARIO
    // =========================================

    if (
        oldTempMin !== tempMin ||
        oldTempMax !== tempMax
    ) {

        temperatureGauge.setMinValue(
            tempMin
        );

        temperatureGauge.setMaxValue(
            tempMax
        );

    }


    // =========================================
    // CONO ROSSO MIN / MAX
    // =========================================

    temperatureGauge.setArea([

        steelseries.Section(
            temperatureMin,
            temperatureMax,
            "rgba(236, 45, 45, 0.17)"
        )

    ]);


    // =========================================
    // AGGIORNA VALORE ATTUALE
    // =========================================

    temperatureValue = value;

    temperatureGauge.setValueAnimated(
        temperatureValue
    );

}

// =========================================
// SCALA DINAMICA
// Scala sempre di 60 °C
// Step di 10 °C
// =========================================

function updateDewpointGauge(value) {

    // -----------------------------------------
    // Se supera il massimo della scala
    // -----------------------------------------

    while (value > dewpointGaugeMax) {

        dewpointGaugeMin += dewpointStep;
        dewpointGaugeMax += dewpointStep;

    }


    // -----------------------------------------
    // Se scende sotto il minimo della scala
    // -----------------------------------------

    while (value < dewpointGaugeMin) {

        dewpointGaugeMin -= dewpointStep;
        dewpointGaugeMax -= dewpointStep;

    }


    // -----------------------------------------
    // Aggiorna la scala solamente se cambiata
    // -----------------------------------------

    if (
        dewpointGauge.getMinValue() !== dewpointGaugeMin ||
        dewpointGauge.getMaxValue() !== dewpointGaugeMax
    ) {

        dewpointGauge.setMinValue(dewpointGaugeMin);

        dewpointGauge.setMaxValue(dewpointGaugeMax);

    }


    // -----------------------------------------
    // Aggiorna il cono min/max
    // -----------------------------------------

    dewpointGauge.setArea([

        steelseries.Section(
            dewpointMinRecorded,
            dewpointMaxRecorded,
            "rgba(236, 45, 45, 0.17)"
        )

    ]);


    // -----------------------------------------
    // Aggiorna il valore
    // -----------------------------------------

    dewpointGauge.setValueAnimated(value);

}
