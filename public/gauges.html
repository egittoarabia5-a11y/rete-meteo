<!DOCTYPE html>
<html lang="it">

<head>

    <title>Stazione meteo</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: "Inter", sans-serif;
        }

        /* SFONDO STAZIONE */
        #stationBackground {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
            z-index: 0;
        }

        /* BARRA SUPERIORE */
        .top-bar {
            position: fixed;
            top: 14px;
            left: 14px;
            right: 14px;
            height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 24px;
            border-radius: 32px;
            background: rgb(160, 160, 160);
            border: 1px solid #d6d6d6;
            color: white;
            z-index: 99999;
        }

        .station-name {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.03em;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* AREA CONTENUTI (qui andranno i grafici) */
        #content {
            position: fixed;
            top: 95px;
            left: 10%;
            right: 10%;
            bottom: 14px;
            z-index: 900;
            overflow-y: auto;
        }

        /* MODALITÀ TELEFONO */
        @media (max-width: 700px) {

            html, body {
                overflow-x: hidden;
                overflow-y: auto;
                background: #e8dfc8;
            }

            #stationBackground { content: url("beige.webp"); }

            .top-bar {
                position: relative;
                top: 10px;
                left: 10px;
                right: auto;
                width: calc(100% - 20px);
                height: auto;
                min-height: 64px;
                padding: 12px 16px;
                border-radius: 20px;
            }

            .station-name {
                font-size: 17px;
                line-height: 1.35;
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
            }

            #content {
                position: relative;
                top: auto; left: auto; right: auto; bottom: auto;
                width: 100%;
                margin-top: 24px;
                padding: 0 10px 20px;
            }
        }

        /* =========================================
           GRAFICO GIGANTE (3 ore, 1 punto al minuto)
        ========================================= */

        .chart-tabs {
            display: flex;
            gap: 8px;
            margin: 18px 0 12px;
            padding-bottom: 2px;
            overflow-x: auto;
        }

        .chart-tab {
            flex: 0 0 auto;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 100px;
            border: 1px solid #d6d6d6;
            background: rgb(160, 160, 160);
            color: #fff;
            cursor: pointer;
            transition: background-color .2s ease, color .2s ease;
        }

        .chart-tab-group {
            flex: 0 0 auto;
            align-self: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .55);
            padding: 0 2px 0 8px;
        }

        .chart-tab-group:first-child { padding-left: 0; }

        .chart-tab:hover { background: rgb(140, 140, 140); }

        .chart-tab.active {
            background: #fff;
            color: #222;
        }

        .chart-panel {
            background: rgba(20, 24, 32, 0.82);
            border: 1px solid rgba(243, 237, 224, 0.16);
            border-radius: 20px;
            padding: 16px 16px 12px;
            color: #f3ede0;
            margin-bottom: 20px;
        }

        .chart-head {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 12px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .chart-head .title { font-weight: 600; }
        .chart-head .range { opacity: .7; }

        .chart-wrap {
            position: relative;
            width: 100%;
        }

        .chart-wrap svg {
            display: block;
            width: 100%;
            cursor: crosshair;
            touch-action: pan-y;
        }

        .chart-tooltip {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0;
            background: rgba(243, 237, 224, 0.96);
            color: #12202b;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.45;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: opacity .1s ease;
        }

        .chart-tooltip.visible { opacity: 1; }

        .chart-tooltip .chip {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .cg-line   { stroke: rgba(243, 237, 224, 0.13); stroke-width: 1; }
        .cg-line.v { stroke: rgba(243, 237, 224, 0.06); }
        .cg-line.h { stroke: rgba(243, 237, 224, 0.20); }

        .cg-empty  { font-family: "Inter", sans-serif; font-size: 14px; fill: rgba(243, 237, 224, 0.5); }

</head>

<body>

    <img id="stationBackground" alt="">

    <div class="top-bar">
        <div class="station-name" id="stationName">Caricamento...</div>
    </div>

    <!-- Qui andranno i grafici -->

    <script>

/* =========================================
   RETI SUPPORTATE
   chiave normalizzata (minuscolo, solo lettere/numeri) → etichetta
========================================= */

const NETWORKS = {
    omirl:          "OMIRL",
    wunderground:   "Wunderground",
    limet:          "LIMET",
    ignorete:       "IGNORETE",
    comunedigenova: "Comune di Genova",
    acronet:        "Acronet"
};

function normalizeSource(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}


/* =========================================
   REGISTRO STAZIONI CON NOME/SFONDO DEDICATI
   (solo le reti che hanno foto o nome esteso;
    per le altre si usa il parametro "name")
   formato: ID: [nome, immagine]
========================================= */

const BG_DEFAULT = "beige.webp";

const REGISTRY = {

    },

        "ITORRI4":    ["Laccio (GE) - Fonte: Wunderground - Altitudine: 625 m.s.l.m.", "Laccio2.png"],
        "IGENOA2819": ["Genova Marassi - Fonte: Wunderground - Altitudine: 25 m.s.l.m.", "Marassi2.png"],
        "IGENOA3058": ["Genova Castelletto - Fonte: Wunderground - Altitudine: 189 m.s.l.m.", "Castelletto2.png"],
        "IGENOA2865": ["Genova Granarolo - Fonte: LIMET - Altitudine: 255 m.s.l.m.", "Granarolo2.png"],
        "IGENOA3021": ["Genova Begato - Fonte: Wunderground - Altitudine: 269 m.s.l.m.", "Begato2.png"],
        "IGENOA2881": ["Genova Bolzaneto - Fonte: Wunderground - Altitudine: 75 m.s.l.m.", BG_DEFAULT],
        "ILIGURIA67": ["Genova Villa Scassi - Fonte: Wunderground - Altitudine: 70 m.s.l.m.", BG_DEFAULT],
        "IGENOA3078": ["Genova Fiumara - Fonte: Wunderground - Altitudine: 23 m.s.l.m.", BG_DEFAULT],
        "IGENOA2962": ["Genova Costa di Sestri - Fonte: Wunderground - Altitudine: 55 m.s.l.m.", BG_DEFAULT],
        "IGENOA2783": ["Genova Terpi - Fonte: Wunderground - Altitudine: 241 m.s.l.m.", BG_DEFAULT],
        "IGENOA3082": ["Geirato (GE) - Fonte: Wunderground - Altitudine: 77 m.s.l.m.", BG_DEFAULT],
        "IGENOA3120": ["Genova Molassana - Fonte: Wunderground - Altitudine: 59 m.s.l.m.", BG_DEFAULT],
        "IGENOA2933": ["Serino (GE) - Fonte: Wunderground - Altitudine: 188 m.s.l.m.", BG_DEFAULT],
        "IGENOA3032": ["Genova Fontanegli - Fonte: Wunderground - Altitudine: 302 m.s.l.m.", BG_DEFAULT],
        "IGENOA3135": ["Genova S. Desiderio - Fonte: Wunderground - Altitudine: 115 m.s.l.m.", BG_DEFAULT],
        "IGENOA2929": ["Genova Poggio di Bavari - Fonte: Wunderground - Altitudine: 144 m.s.l.m.", BG_DEFAULT],
        "IGENOA3138": ["Pino Soprano (GE) - Fonte: Wunderground - Altitudine: 301 m.s.l.m.", BG_DEFAULT],
        "IDAVAG2":    ["Davagna (GE) - Fonte: Wunderground - Altitudine: 431 m.s.l.m.", BG_DEFAULT],
        "IBARGAGL5":  ["Traso (GE) - Fonte: Wunderground - Altitudine: 512 m.s.l.m.", BG_DEFAULT],
        "IGENOA2775": ["Genova Pegli Liso - Fonte: Wunderground - Altitudine: 7 m.s.l.m.", BG_DEFAULT],
        "IGENOA2839": ["Genova Lavatrici - Fonte: Wunderground - Altitudine: 91 m.s.l.m.", BG_DEFAULT],
        "IMELE15":    ["Mele (GE) - Fonte: Wunderground - Altitudine: 120 m.s.l.m.", "Mele2.png"],
        "IMELE16":    ["Acquasanta (GE) - Fonte: Wunderground - Altitudine: 205 m.s.l.m.", "Acquasanta2.png"],
        "IURBE3":     ["Passo del Faiallo (GE) - Fonte: LIMET - Altitudine: 1.039 m.s.l.m.", "Faiallo2.png"],
        "IVARAZ2":    ["Monte Beigua (SV) - Fonte: LIMET - Altitudine: 1.285 m.s.l.m.", "Beigua2.png"],
        "ICAMPO445":  ["Pietralavezzara (GE) - Fonte: LIMET - Altitudine: 570 m.s.l.m.", BG_DEFAULT],
        "ICAMPO312":  ["Campomorone (GE) - Fonte: Wunderground - Altitudine: 147 m.s.l.m.", BG_DEFAULT],
        "IGENOA2959": ["Genova Pontedecimo - Fonte: Wunderground - Altitudine: 105 m.s.l.m.", BG_DEFAULT],
        "ISANTA1774": ["Santa Margherita Ligure (GE) - Fonte: Wunderground - Altitudine: 28 m.s.l.m.", BG_DEFAULT],
        "IROVEG2":    ["Rovegno - Foppiano (GE) - Fonte: Wunderground - Altitudine: 953 m.s.l.m.", BG_DEFAULT]
    }

    // Le altre reti (LIMET, IGNORETE, Comune di Genova, Acronet) non hanno
    // ancora foto dedicate: per aggiungerne una basta inserire qui
    // una nuova chiave (es. limet: { "Genova Oregina": ["...", "Oregina.png"] }).
};


/* =========================================
   ALGORITMO: DAL LINK ALLA STAZIONE
   Legge ?station=...&source=...&name=... e
   costruisce un oggetto "stationContext".
========================================= */

function resolveStation() {

    const params = new URLSearchParams(window.location.search);

    const stationId   = params.get("station");
    const sourceRaw   = params.get("source");
    const nameParam   = params.get("name");

    const networkKey  = normalizeSource(sourceRaw);
    const networkName = NETWORKS[networkKey];

    // Parametri mancanti o rete sconosciuta
    if (!stationId || !networkName) {
        return {
            found: false,
            stationId,
            sourceRaw,
            reason: !stationId ? "station mancante" : "source sconosciuta"
        };
    }

    // Eventuale voce dedicata nel registro (nome esteso + sfondo)
    const entry = REGISTRY[networkKey]?.[stationId];

    // Nome mostrato: voce di registro → parametro name → station
    // Se il nome non contiene già la fonte, la aggiungo.
    let displayName;

    if (entry) {
        displayName = entry[0];
    } else {
        const base = nameParam || stationId;
        displayName = base + " - Fonte: " + networkName;
    }

    return {
        found: true,
        network: networkKey,          // es. "limet", "comunedigenova"
        networkName,                  // es. "LIMET", "Comune di Genova"
        stationId,                    // valore di ?station=
        name: nameParam || stationId, // nome "pulito"
        displayName,                  // titolo mostrato in alto
        background: entry ? entry[1] : BG_DEFAULT
    };
}


/* =========================================
   COSTRUZIONE PAGINA
========================================= */

const stationContext = resolveStation();

const stationNameEl = document.getElementById("stationName");
const stationBgEl   = document.getElementById("stationBackground");

if (stationContext.found) {

    stationNameEl.textContent = stationContext.displayName;
    document.title            = stationContext.displayName;
    stationBgEl.src           = stationContext.background;

} else {

    console.warn("Stazione non risolta:", stationContext);

    stationNameEl.textContent    = "Stazione non trovata";
    stationBgEl.style.display    = "none";

}

// Esposto per i grafici che aggiungeremo dopo
window.stationContext = stationContext;

document.dispatchEvent(
    new CustomEvent("station-ready", { detail: stationContext })
);


/* =========================================
   DATI DELLA STAZIONE
   latestData contiene l'ultima lettura normalizzata.
   Ogni rete ha il suo fetch in FETCHERS.
========================================= */

const REFRESH_MS = 10 * 1000;

let latestData = null;

// Converte in numero; null / "" / non numerico → null ("20,4" accettato)
function toNum(v) {
    if (v === null || v === undefined || v === "") return null;
    const n = parseFloat(String(v).replace(",", "."));
    return Number.isFinite(n) ? n : null;
}


/* =========================================
   FETCH OMIRL
   Sorgente: tutte le stazioni in un unico JSON,
   si prende quella con id = ?station=
========================================= */

const OMIRL_URL = "https://api-stazioni-meteo.eggittof.workers.dev/omirl.json";

async function fetchOMIRL(stationId) {

    const res = await fetch(OMIRL_URL + "?_=" + Date.now());

    if (!res.ok) {
        throw new Error("OMIRL HTTP " + res.status);
    }

    const json = await res.json();

    const raw = json.stations?.find(
        s => String(s.id).toUpperCase() === String(stationId).toUpperCase()
    );

    if (!raw) {
        throw new Error("Stazione OMIRL non trovata nel JSON: " + stationId);
    }

    return {

        source: "OMIRL",
        id: raw.id,
        lat: toNum(raw.lat),
        lon: toNum(raw.lon),

        // Temperatura
        temp: toNum(raw.temp),
        tempHigh: toNum(raw.tempHigh),
        tempLow: toNum(raw.tempLow),

        // Umidità
        hum: toNum(raw.hum),
        humHigh: toNum(raw.humHigh),
        humLow: toNum(raw.humLow),

        // Dew point e heat index
        dewp: toNum(raw.dewPoint),
        heat: toNum(raw.HI),

        // Vento (nel JSON: wind, windGust, windDir, windValue)
        wind: toNum(raw.windValue ?? raw.wind),
        windGust: toNum(raw.windGust),
        windDir: toNum(raw.windDir),

        // Pioggia
        rainRate: toNum(raw.rainRate),
        rainDaily: toNum(raw.rainDaily),

        // Dato originale, per comodità
        raw
    };
}


/* =========================================
   DISPATCHER: sceglie il fetch in base alla rete
   (le altre reti si aggiungono qui)
========================================= */

/* =========================================
   FETCH IGNORETE
   Sorgente: ignorete.json ({ stations: [...] }).
   Dal worker dell'archivio si sa con certezza solo: id, lat, lon e
   R (pioggia). Gli altri campi sono cercati con più nomi possibili
   (stile LIMET: T, TH, TL… oppure stile OMIRL: temp, tempHigh…);
   il record originale resta in "raw" e viene scritto in console.
========================================= */

const IGNORETE_URL = "https://api-stazioni-meteo.eggittof.workers.dev/ignorete.json";

// primo campo presente tra quelli indicati, convertito in numero
function pickNum(raw, keys) {
    for (const k of keys) {
        if (raw[k] !== undefined && raw[k] !== null && raw[k] !== "") return toNum(raw[k]);
    }
    return null;
}

async function fetchIGNORETE(stationId) {

    const res = await fetch(IGNORETE_URL + "?_=" + Date.now());

    if (!res.ok) {
        throw new Error("IGNORETE HTTP " + res.status);
    }

    const json = await res.json();

    const list = Array.isArray(json) ? json : (json.stations || []);

    const wanted = String(stationId).trim().toUpperCase();

    // la stazione si riconosce dall'id (nel link: ?station=...)
    const raw = list.find(function (s) {
        return s && String(s.id ?? s.name ?? s.N ?? "").trim().toUpperCase() === wanted;
    });

    if (!raw) {
        throw new Error("Stazione IGNORETE non trovata nel JSON: " + stationId);
    }

    return {

        source: "IGNORETE",
        id: raw.id,
        lat: pickNum(raw, ["lat"]),
        lon: pickNum(raw, ["lon"]),

        temp: pickNum(raw, ["T", "temp"]),
        tempHigh: pickNum(raw, ["TH", "tempHigh"]),
        tempLow: pickNum(raw, ["TL", "tempLow"]),

        hum: pickNum(raw, ["H", "hum"]),
        humHigh: pickNum(raw, ["HH", "humHigh"]),
        humLow: pickNum(raw, ["HL", "humLow"]),

        dewp: pickNum(raw, ["D", "dewPoint", "dewp"]),
        heat: pickNum(raw, ["HI", "heat"]),

        wind: pickNum(raw, ["V", "windValue", "wind"]),
        windGust: pickNum(raw, ["VR", "windGust"]),
        windDir: pickNum(raw, ["windDir", "VD"]),

        rainRate: pickNum(raw, ["RR", "rainRate"]),
        rainDaily: pickNum(raw, ["R", "rainDaily"]),

        raw
    };
}


/* =========================================
   FETCH LIMET
   Due file con stazioni diverse: si cerca prima in limet.json,
   e solo se la stazione non c'è si passa a limet2.json.
   La stazione si riconosce dal NOME (campo N), non da un ID.
   I numeri arrivano come stringhe con la virgola ("20,4"): toNum li gestisce.
========================================= */

const LIMET_URLS = [
    "https://api-stazioni-meteo.eggittof.workers.dev/limet.json",
    "https://api-stazioni-meteo.eggittof.workers.dev/limet2.json"
];

async function fetchLIMET(stationName) {

    const wanted = String(stationName).trim().toLowerCase();

    let raw = null;
    let foundIn = null;
    const problems = [];

    for (const url of LIMET_URLS) {

        try {

            const res = await fetch(url + "?_=" + Date.now());

            if (!res.ok) {
                problems.push("HTTP " + res.status + " da " + url);
                continue;
            }

            const json = await res.json();

            const list = Array.isArray(json) ? json : (json.stations || []);

            raw = list.find(function (s) {
                return s && String(s.N ?? "").trim().toLowerCase() === wanted;
            });

            if (raw) {
                foundIn = url;
                break;          // trovata: non serve il secondo file
            }

        } catch (err) {
            problems.push(String(err.message || err) + " (" + url + ")");
        }
    }

    if (!raw) {
        throw new Error(
            "Stazione LIMET non trovata: " + stationName +
            (problems.length ? " [" + problems.join("; ") + "]" : "")
        );
    }

    return {

        source: "LIMET",
        id: raw.N,
        file: foundIn,

        // Temperatura
        temp: toNum(raw.T),
        tempHigh: toNum(raw.TH),
        tempLow: toNum(raw.TL),

        // Umidità
        hum: toNum(raw.H),
        humHigh: toNum(raw.HH),
        humLow: toNum(raw.HL),

        // Dew point e heat index
        dewp: toNum(raw.D),
        dewpHigh: toNum(raw.DH),
        dewpLow: toNum(raw.DL),
        heat: toNum(raw.HI),

        // Vento (V = velocità, VR = raffica; la direzione non è nel file)
        wind: toNum(raw.V),
        windGust: toNum(raw.VR),
        windDir: null,

        // Pioggia
        rainRate: toNum(raw.RR),
        rainDaily: toNum(raw.R),

        // Pressione
        pressure: toNum(raw.P),

        raw
    };
}


const FETCHERS = {
    limet: fetchLIMET,
    ignorete: fetchIGNORETE,
    omirl: fetchOMIRL
    // limet: fetchLimet,
    // wunderground: fetchPws,
    // ignorete: ...,
    // comunedigenova: ...,
    // acronet: ...
};

async function refreshData() {

    const fetcher = FETCHERS[stationContext.network];

    if (!fetcher) {
        console.warn("Nessun fetch per la rete:", stationContext.network);
        return;
    }

    try {

        latestData = await fetcher(stationContext.stationId);

        console.log("Dati " + stationContext.networkName + ":", latestData);

        document.dispatchEvent(
            new CustomEvent("station-data", { detail: latestData })
        );

    } catch (err) {

        console.error("Errore fetch " + stationContext.networkName + ":", err);

        document.dispatchEvent(
            new CustomEvent("station-error", { detail: err })
        );
    }
}

if (stationContext.found) {
    refreshData();
    setInterval(refreshData, REFRESH_MS);
}


/* =========================================
   LETTURA PROVVISORIA DEI DATI
   (solo per verificare il fetch: da sostituire coi grafici)
========================================= */

const contentEl = document.getElementById("readout");

const READOUT = [
    ["Temperatura (°C)", "temp"],
    ["Max (°C)", "tempHigh"],
    ["Min (°C)", "tempLow"],
    ["Umidità (%)", "hum"],
    ["Umidità max (%)", "humHigh"],
    ["Umidità min (%)", "humLow"],
    ["Dew point (°C)", "dewp"],
    ["Heat index (°C)", "heat"],
    ["Vento", "wind"],
    ["Raffica", "windGust"],
    ["Direzione (°)", "windDir"],
    ["Rain rate (mm/h)", "rainRate"],
    ["Pioggia giorno (mm)", "rainDaily"]
];

document.addEventListener("station-data", function (e) {

    const d = e.detail;

    contentEl.innerHTML =
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;">' +
        READOUT.map(function (r) {
            const v = d[r[1]];
            return '<div style="background:rgba(160,160,160,.85);color:#fff;border-radius:12px;padding:10px 14px;">' +
                   '<div style="font-size:12px;opacity:.8;">' + r[0] + '</div>' +
                   '<div style="font-size:22px;font-weight:600;">' + (v === null ? "--" : v) + '</div>' +
                   '</div>';
        }).join("") +
        '</div>';
});

document.addEventListener("station-error", function (e) {
    contentEl.innerHTML =
        '<div style="background:rgba(160,160,160,.85);color:#fff;border-radius:12px;padding:12px 16px;">' +
        'Dati non disponibili: ' + e.detail.message + '</div>';
});



/* =========================================
   GRAFICO: colori in base al valore
   (stessa scala della temperatura usata nelle altre pagine)
========================================= */

const TEMP_COLORS = [
    [-15, "#f54dff"], [-10, "#c65bff"], [-4, "#4d54ff"], [-2, "#1f7eb9"],
    [Number.MIN_VALUE, "#539eb0"],   // da -2 a 0 compreso
    [2, "#67bac8"], [4, "#5ac5ba"], [6, "#42a37b"], [8, "#538b53"],
    [10, "#419a41"], [12, "#5cb425"], [14, "#76ca38"], [16, "#a1d950"],
    [18, "#eadf00"], [20, "#ffcc55"], [22, "#ffaf54"], [24, "#fa8f4b"],
    [26, "#f26969"], [28, "#de5a5a"], [30, "#b05151"], [32, "#994848"],
    [34, "#743e3e"], [36, "#b874ac"], [38, "#ea7bea"]
];

function getTempColor(value) {
    for (const [limit, color] of TEMP_COLORS) {
        if (value < limit) return color;
    }
    return "#995a99";   // da 38°C in su
}


/* =========================================
   GRAFICO: impostazioni
   (per un'altra grandezza basta cambiare questi 5 campi)
========================================= */

// Colori della pioggia (stessa scala delle altre pagine)
function getRainColor(v) {
    if (v === 0) return "#808080";
    if (v < 2)   return "#f9ae6c";
    if (v < 5)   return "#f9966c";
    if (v < 10)  return "#6ca561";
    if (v < 20)  return "#65d050";
    if (v < 30)  return "#4dc8ff";
    if (v < 50)  return "#4da9ff";
    return "#2c278e";
}

const CHART = {
    title: "Pioggia",
    unit: "mm",
    decimals: 1,
    gridStep: 1,              // passo base delle linee orizzontali
    minZero: true,            // la scala parte sempre da 0
    colorFn: getRainColor
};

const BLOCK_MIN = 360;                      // 6 ore per riquadro
const BLOCKS_PER_DAY = 1440 / BLOCK_MIN;    // 4 riquadri al giorno
const GRID_MIN = 30;                        // linee verticali ogni 30 minuti


/* =========================================
   GRAFICO: struttura HTML
========================================= */

const chartSection = document.getElementById("chartSection");

chartSection.innerHTML =
    '<div class="chart-tabs" id="chartTabs"></div>' +
    '<div class="chart-panel">' +
        '<div class="chart-head">' +
            '<span class="title">' + CHART.title + '</span>' +
            '<span class="range" id="chartRange"></span>' +
        '</div>' +
        '<div class="chart-wrap" id="chartWrap">' +
            '<svg id="chartSvg"></svg>' +
            '<div class="chart-tooltip" id="chartTooltip"></div>' +
        '</div>' +
    '</div>';

const chartTabs    = document.getElementById("chartTabs");
const chartWrap    = document.getElementById("chartWrap");
const chartSvg     = document.getElementById("chartSvg");
const chartTooltip = document.getElementById("chartTooltip");
const chartRange   = document.getElementById("chartRange");


/* =========================================
   GRAFICO: stato
   Due giorni: [0] = ieri, [1] = oggi.
   dayValues[g][m] = valore al minuto m (0..1439) del giorno g, null se manca.
   Riquadri 0-3 = ieri (00-06 … 18-24), riquadri 4-7 = oggi.
========================================= */

function pad2(n) { return String(n).padStart(2, "0"); }

function fmtMin(m) { return pad2(Math.floor(m / 60)) + ":" + pad2(m % 60); }

function minutesNow() {
    const n = new Date();
    return n.getHours() * 60 + n.getMinutes();
}

// mezzanotte locale di oggi (offset 0) o di un altro giorno (-1 = ieri)
function dayStart(offset) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + offset);
    return d;
}

let chartDays = [dayStart(-1), dayStart(0)];

const dayValues = [
    new Array(1440).fill(null),
    new Array(1440).fill(null)
];

// all'apertura si vede il riquadro dell'ora attuale (di oggi)
let chartBlock = BLOCKS_PER_DAY + Math.floor(minutesNow() / BLOCK_MIN);

let chartGeom = null;


/* =========================================
   GRAFICO: tab  Ieri 00-06 … 18-24  |  Oggi 00-06 … 18-24
========================================= */

for (let i = 0; i < BLOCKS_PER_DAY * 2; i++) {

    // etichetta del gruppo prima del primo riquadro di ogni giorno
    if (i % BLOCKS_PER_DAY === 0) {
        const lab = document.createElement("span");
        lab.className = "chart-tab-group";
        lab.textContent = (i === 0) ? "Ieri" : "Oggi";
        chartTabs.appendChild(lab);
    }

    const k = i % BLOCKS_PER_DAY;
    const hFrom = k * BLOCK_MIN / 60;
    const hTo = (k + 1) * BLOCK_MIN / 60;

    const b = document.createElement("button");

    b.type = "button";
    b.className = "chart-tab";
    b.dataset.block = String(i);
    b.textContent = pad2(hFrom) + "-" + pad2(hTo);

    b.addEventListener("click", function () {
        chartBlock = i;
        updateTabs();
        renderChart();
    });

    chartTabs.appendChild(b);
}

function updateTabs() {
    chartTabs.querySelectorAll(".chart-tab").forEach(function (b) {
        b.classList.toggle("active", Number(b.dataset.block) === chartBlock);
    });
}


/* =========================================
   GRAFICO: disegno
========================================= */

function renderChart() {

    const W = Math.max(280, chartWrap.clientWidth || 800);
    const H = window.innerWidth <= 700 ? 300 : 420;

    const padL = 46, padR = 22, padT = 18, padB = 30;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // giorno (0 = ieri, 1 = oggi) e minuti del riquadro visibile
    const dayIdx = Math.floor(chartBlock / BLOCKS_PER_DAY);
    const values = dayValues[dayIdx];

    const startMin = (chartBlock % BLOCKS_PER_DAY) * BLOCK_MIN;
    const endMin = startMin + BLOCK_MIN;
    const lastIdx = Math.min(endMin, 1439);

    const xFor = m => padL + (m - startMin) / BLOCK_MIN * plotW;

    // ----- scala verticale (sui dati del riquadro visibile)
    const vals = [];
    for (let m = startMin; m <= lastIdx; m++) {
        if (values[m] !== null) vals.push(values[m]);
    }

    const hasData = vals.length > 0;

    let step = CHART.gridStep;
    let gridMin = 0, gridMax = 10;

    if (hasData) {

        const vMin = CHART.minZero
            ? Math.min(0, Math.min.apply(null, vals))
            : Math.min.apply(null, vals);
        const vMax = Math.max.apply(null, vals);

        while ((vMax - vMin) / step > 8) step *= 2;

        gridMin = Math.floor(vMin / step) * step;
        gridMax = Math.ceil(vMax / step) * step;

        if (gridMax - gridMin < step * 2) gridMax = gridMin + step * 2;
    }

    const yFor = v => padT + (1 - (v - gridMin) / (gridMax - gridMin)) * plotH;

    // ----- segmenti continui (un buco nei dati interrompe la linea)
    const segments = [];
    let cur = [];

    for (let m = startMin; m <= lastIdx; m++) {

        const v = values[m];

        if (v === null) {
            if (cur.length) segments.push(cur);
            cur = [];
        } else {
            cur.push({ m: m, v: v, x: xFor(m), y: yFor(v) });
        }
    }
    if (cur.length) segments.push(cur);

    // ----- gradiente: il colore segue il valore lungo la linea
    let stops = "";
    segments.forEach(function (seg) {
        seg.forEach(function (p) {
            const off = ((p.x - padL) / plotW * 100).toFixed(2);
            stops += '<stop offset="' + off + '%" stop-color="' + CHART.colorFn(p.v) + '"/>';
        });
    });

    let svg =
        '<defs>' +
            '<linearGradient id="chartGradient" gradientUnits="userSpaceOnUse" x1="' + padL + '" y1="0" x2="' + (W - padR) + '" y2="0">' + stops + '</linearGradient>' +
            '<filter id="chartBlur" filterUnits="userSpaceOnUse" x="0" y="0" width="' + W + '" height="' + H + '">' +
                '<feGaussianBlur stdDeviation="8"/>' +
            '</filter>' +
        '</defs>';

    // ----- griglia orizzontale + scala dei valori
    for (let g = gridMin; g <= gridMax + 1e-9; g += step) {
        const y = yFor(g);
        svg += '<line class="cg-line h" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '"/>';
        svg += '<text class="cg-label" x="' + (padL - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + (Math.round(g * 10) / 10) + '</text>';
    }

    // ----- griglia verticale: ogni 30 minuti, etichetta ogni ora (ogni 2 ore su schermi stretti)
    const labelEvery = W < 520 ? 120 : 60;

    for (let m = startMin; m <= endMin; m += GRID_MIN) {
        const x = xFor(m).toFixed(1);
        const isLabel = (m - startMin) % labelEvery === 0;
        svg += '<line class="cg-line ' + (isLabel ? "" : "v") + '" x1="' + x + '" y1="' + padT + '" x2="' + x + '" y2="' + (H - padB) + '"/>';
        if (isLabel) {
            svg += '<text class="cg-label" x="' + x + '" y="' + (H - 8) + '" text-anchor="middle">' + fmtMin(m) + '</text>';
        }
    }

    svg += '<text class="cg-label" x="' + (W - padR) + '" y="12" text-anchor="end" style="font-weight:600">' + CHART.unit + '</text>';

    // ----- linea "ora" (solo se il riquadro contiene l'ora attuale di oggi)
    const nowMin = minutesNow();
    const isToday = dayIdx === 1 && chartDays[1].toDateString() === new Date().toDateString();

    if (isToday && nowMin >= startMin && nowMin <= endMin) {
        const xn = xFor(nowMin).toFixed(1);
        svg += '<line x1="' + xn + '" y1="' + padT + '" x2="' + xn + '" y2="' + (H - padB) + '" stroke="rgba(243,237,224,.45)" stroke-width="1" stroke-dasharray="4 4"/>';
    }

    // ----- linee: alone colorato sfocato + linea sottile chiara
    segments.forEach(function (seg) {

        if (seg.length === 1) {
            svg += '<circle cx="' + seg[0].x.toFixed(1) + '" cy="' + seg[0].y.toFixed(1) + '" r="3" fill="' + CHART.colorFn(seg[0].v) + '"/>';
            return;
        }

        const pts = seg.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");

        svg += '<polyline points="' + pts + '" fill="none" stroke="url(#chartGradient)" stroke-width="10" filter="url(#chartBlur)" opacity="0.65" stroke-linecap="round" stroke-linejoin="round"/>';
        svg += '<polyline points="' + pts + '" fill="none" stroke="#f3ede0" stroke-width="2.2" opacity="0.95" stroke-linecap="round" stroke-linejoin="round"/>';
    });

    if (!hasData) {
        svg += '<text class="cg-empty" x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle">Nessun dato disponibile</text>';
    }

    // ----- elementi dell'interazione (nascosti finché non si passa sopra)
    svg += '<line id="chartCross" x1="0" y1="' + padT + '" x2="0" y2="' + (H - padB) + '" stroke="rgba(243,237,224,.7)" stroke-width="1" style="display:none"/>';
    svg += '<circle id="chartDot" r="5.5" cx="0" cy="0" stroke="#f3ede0" stroke-width="2" style="display:none"/>';

    chartSvg.setAttribute("width", W);
    chartSvg.setAttribute("height", H);
    chartSvg.setAttribute("viewBox", "0 0 " + W + " " + H);
    chartSvg.innerHTML = svg;

    chartGeom = { W, H, padL, padR, padT, padB, plotW, startMin, endMin, lastIdx, dayIdx, xFor, yFor };

    chartRange.textContent =
        (dayIdx === 0 ? "Ieri" : "Oggi") + " · " +
        chartDays[dayIdx].toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }) +
        " · " + fmtMin(startMin) + " – " + fmtMin(endMin);

    chartTooltip.classList.remove("visible");
}


/* =========================================
   GRAFICO: interazione (mouse e touch)
   Linea verticale + punto + tooltip sul minuto più vicino
========================================= */

function hideChartCursor() {

    chartTooltip.classList.remove("visible");

    const cross = document.getElementById("chartCross");
    const dot = document.getElementById("chartDot");

    if (cross) cross.style.display = "none";
    if (dot) dot.style.display = "none";
}

function onChartPointer(e) {

    if (!chartGeom) return;

    const g = chartGeom;
    const rect = chartSvg.getBoundingClientRect();
    const x = e.clientX - rect.left;

    if (x < g.padL - 6 || x > g.W - g.padR + 6) {
        hideChartCursor();
        return;
    }

    // minuto sotto il cursore
    let m = Math.round(g.startMin + (x - g.padL) / g.plotW * BLOCK_MIN);
    m = Math.max(g.startMin, Math.min(g.lastIdx, m));

    const values = dayValues[g.dayIdx];

    // se manca il dato, cerca il più vicino entro 3 minuti
    let found = null;

    for (let d = 0; d <= 3 && found === null; d++) {
        if (values[m - d] !== undefined && values[m - d] !== null && m - d >= g.startMin) found = m - d;
        else if (values[m + d] !== undefined && values[m + d] !== null && m + d <= g.lastIdx) found = m + d;
    }

    const mm = (found !== null) ? found : m;
    const v = (found !== null) ? values[found] : null;
    const cx = g.xFor(mm);

    const cross = document.getElementById("chartCross");
    const dot = document.getElementById("chartDot");

    cross.setAttribute("x1", cx);
    cross.setAttribute("x2", cx);
    cross.style.display = "";

    if (v !== null) {
        dot.setAttribute("cx", cx);
        dot.setAttribute("cy", g.yFor(v));
        dot.setAttribute("fill", CHART.colorFn(v));
        dot.style.display = "";

        chartTooltip.innerHTML =
            "<b>" + fmtMin(mm) + "</b><br>" +
            '<span class="chip" style="background:' + CHART.colorFn(v) + '"></span>' +
            v.toFixed(CHART.decimals) + " " + CHART.unit;
    } else {
        dot.style.display = "none";
        chartTooltip.innerHTML = "<b>" + fmtMin(mm) + "</b><br>--";
    }

    // posizione del tooltip: a destra del cursore, a sinistra se non c'è spazio
    chartTooltip.classList.add("visible");

    const tipW = chartTooltip.offsetWidth;
    let left = cx + 14;
    if (left + tipW > g.W) left = cx - 14 - tipW;

    chartTooltip.style.left = Math.max(2, left) + "px";
    chartTooltip.style.top = (g.padT + 6) + "px";
}

chartSvg.addEventListener("pointermove", onChartPointer);
chartSvg.addEventListener("pointerdown", onChartPointer);
chartSvg.addEventListener("pointerleave", hideChartCursor);


/* =========================================
   GRAFICO: ingresso dei dati (per ora vuoto)

   stationChart.setData([
       { t: "2026-10-20 00:21", v: 17.4 },   // t = data/ora
       { m: 22, v: 17.3 },                   // oppure m = minuto del giorno
       ...
   ]);

   Ogni punto va nel suo giorno in base alla data (ora locale): ieri
   finisce nei riquadri 0-3, oggi nei riquadri 4-7. I punti di altri
   giorni vengono ignorati. Un punto con solo "m" (minuto) conta come oggi.
========================================= */

// → [giorno (0 ieri, 1 oggi), minuto del giorno] oppure null
function pointSlot(p) {

    if (typeof p.m === "number") return [1, p.m];

    const t = (typeof p.t === "string") ? p.t.replace(" ", "T") : p.t;
    const d = new Date(t);

    if (isNaN(d.getTime())) return null;

    const ds = d.toDateString();

    for (let i = 0; i < 2; i++) {
        if (chartDays[i].toDateString() === ds) {
            return [i, d.getHours() * 60 + d.getMinutes()];
        }
    }

    return null;
}

function setChartData(points) {

    dayValues[0].fill(null);
    dayValues[1].fill(null);

    (points || []).forEach(function (p) {

        const slot = pointSlot(p);
        const v = toNum(p.v);

        if (slot && slot[1] >= 0 && slot[1] < 1440 && v !== null) {
            dayValues[slot[0]][slot[1]] = v;
        }
    });

    renderChart();
}

window.stationChart = {
    setData: setChartData,
    clear: function () { setChartData([]); },
    setBlock: function (i) {
        chartBlock = Math.max(0, Math.min(7, i));
        updateTabs();
        renderChart();
    },
    refresh: renderChart
};


/* =========================================
   GRAFICO: caricamento dall'archivio (UNA SOLA VOLTA all'apertura)
   L'archivio restituisce, per ogni stazione, un valore al minuto:
   { times:[...ISO UTC...], stations:{ ID: "v1, v2, v3, ..." } }
   Gli orari sono in UTC: il browser li converte nell'ora locale
   (es. 22:08Z = 00:08 in Italia).
========================================= */

const ARCHIVE_URL = "https://archivio-eventi.eggittof.workers.dev/export?format=stations&src=";

// rete del link → parametro "src" dell'archivio (altre reti si aggiungono qui)
// Ogni rete ha un ELENCO di fonti: si provano in ordine e si usa la prima
// che contiene la stazione (LIMET: limet1, poi limet2).
const ARCHIVE_SRC = {
    omirl:    ["omirl"],
    ignorete: ["ignorete"],
    limet:    ["limet1", "limet2"]
};

async function loadChartFromArchive() {

    const sources = ARCHIVE_SRC[stationContext.network];

    if (!stationContext.found || !sources) return;

    // ieri + oggi: dalla mezzanotte locale di ieri (espressa in UTC)
    const from = chartDays[0].toISOString().slice(0, 19) + "Z";

    const wanted = String(stationContext.stationId).trim().toUpperCase();

    for (const src of sources) {

        try {

            const res = await fetch(
                // limit=5000: due giorni sono fino a 2880 righe, il default del worker è 2000
                ARCHIVE_URL + encodeURIComponent(src) + "&from=" + encodeURIComponent(from) + "&limit=5000"
            );

            if (!res.ok) throw new Error("Archivio HTTP " + res.status + " (" + src + ")");

            const json = await res.json();

            // chiave stazione, senza distinguere maiuscole/minuscole
            const key = Object.keys(json.stations || {}).find(
                k => k.trim().toUpperCase() === wanted
            );

            if (!key) {
                console.warn("Grafico: stazione assente in archivio " + src + ": " + stationContext.stationId);
                continue;   // prova la fonte successiva
            }

            const values = String(json.stations[key]).split(",");

            const points = [];

            (json.times || []).forEach(function (t, i) {
                points.push({ t: t, v: values[i] });
            });

            setChartData(points);

            return;

        } catch (err) {

            console.error("Grafico: caricamento archivio fallito (" + src + "):", err);
        }
    }

    console.error("Grafico: stazione non trovata in nessuna fonte dell'archivio:", stationContext.stationId);
}

loadChartFromArchive();


/* =========================================
   GRAFICO: avvio, ridimensionamento, cambio giorno
========================================= */

updateTabs();
renderChart();

if (window.ResizeObserver) {
    new ResizeObserver(function () { renderChart(); }).observe(chartWrap);
} else {
    window.addEventListener("resize", renderChart);
}

setInterval(function () {

    // a mezzanotte: oggi diventa ieri e si riparte con un oggi vuoto
    if (chartDays[1].toDateString() !== new Date().toDateString()) {

        const newDays = [dayStart(-1), dayStart(0)];

        // se la pagina era aperta da ieri, i suoi dati diventano "ieri"
        if (chartDays[1].toDateString() === newDays[0].toDateString()) {
            dayValues[0] = dayValues[1];
        } else {
            dayValues[0] = new Array(1440).fill(null);
        }

        dayValues[1] = new Array(1440).fill(null);

        chartDays = newDays;
        chartBlock = BLOCKS_PER_DAY + Math.floor(minutesNow() / BLOCK_MIN);
        updateTabs();
    }

    renderChart();   // sposta la linea "ora"

}, 30 * 1000);

    </script>
