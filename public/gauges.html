<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stazione Meteo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    /* =========================
       ELENCO STAZIONI
       ========================= */

    #stations {
      width: 100%;
      background: white;
      padding: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid #ddd;
    }

    .station-button {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      color: #222;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .station-button:hover {
      background: #e8e8e8;
    }

    .station-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    /* =========================
       CONTENUTO
       ========================= */

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    #info {
      color: #666;
      margin-bottom: 20px;
    }

    #stationImage {
      display: block;
      width: 100%;
      max-width: 1200px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    #error {
      display: none;
      padding: 20px;
      background: #ffe5e5;
      border: 1px solid #ffb0b0;
      border-radius: 10px;
      color: #a00000;
    }
  </style>
</head>

<body>

  <!-- =========================
       ELENCO STAZIONI
       ========================= -->

  <div id="stations"></div>

  <!-- =========================
       CONTENUTO
       ========================= -->

  <main>

    <h1 id="title">Stazione</h1>

    <div id="info"></div>

    <div id="error"></div>

    <img
      id="stationImage"
      src=""
      alt="Immagine stazione"
    >

  </main>

  <script>

    // =========================
    // CONFIGURAZIONE STAZIONI
    // =========================
    
    const stationPhotos = {

      "IGENOA2897": {
        name: "IGENOA2897",
        photo: "SanMartino1.png"
      }

      // Esempio per aggiungere altre stazioni:
      //
      // "IGENOA1234": {
      //   name: "IGENOA1234",
      //   photo: "AltraFoto.png"
      // },
      //
      // "IGENOA5678": {
      //   name: "IGENOA5678",
      //   photo: "AltraFoto2.png"
      // }

    };


    // =========================
    // LEGGE PARAMETRI URL
    // =========================

    const params = new URLSearchParams(window.location.search);

    const station = params.get("station");
    const source = params.get("source");
    const name = params.get("name");


    // =========================
    // CREA ELENCO STAZIONI
    // =========================

    const stationsContainer =
      document.getElementById("stations");

    Object.entries(stationPhotos).forEach(
      ([stationId, data]) => {

        const button =
          document.createElement("a");

        button.className = "station-button";

        if (stationId === station) {
          button.classList.add("active");
        }

        button.textContent = data.name;

        const newParams =
          new URLSearchParams();

        newParams.set("station", stationId);

        if (source) {
          newParams.set("source", source);
        }

        newParams.set("name", data.name);

        button.href =
          `${window.location.pathname}?${newParams.toString()}`;

        stationsContainer.appendChild(button);
      }
    );


    // =========================
    // MOSTRA STAZIONE
    // =========================

    const title =
      document.getElementById("title");

    const info =
      document.getElementById("info");

    const image =
      document.getElementById("stationImage");

    const error =
      document.getElementById("error");


    if (!station) {

      title.textContent =
        "Nessuna stazione selezionata";

      info.textContent =
        "Seleziona una stazione dall'elenco.";

      image.style.display = "none";

    } else if (!stationPhotos[station]) {

      title.textContent =
        "Stazione non trovata";

      info.textContent =
        station;

      image.style.display = "none";

      error.style.display = "block";

      error.textContent =
        `Non è configurata alcuna foto per la stazione "${station}".`;

    } else {

      const data =
        stationPhotos[station];

      title.textContent =
        name || data.name;

      info.textContent =
        `Station: ${station}` +
        (source ? ` • Source: ${source}` : "");

      image.src =
        data.photo;

      image.alt =
        `Foto ${data.name}`;

      image.style.display = "block";

      image.onerror = () => {

        image.style.display = "none";

        error.style.display = "block";

        error.textContent =
          `Impossibile trovare l'immagine "${data.photo}".`;

      };
    }

  </script>

</body>
</html>
