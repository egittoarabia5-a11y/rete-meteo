<!DOCTYPE html>
<html lang="it">
<head>
    <title>Gauges</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #gauge {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>

<body>

    <img id="gauge" alt="Gauge">

    <script>
        const StazioniWunderground = {
            "IGENOA2897": {
                name: "Genova San Martino - Fonte: Wunderground - Altitudine: 104 m.s.l.m.",
                link: "SanMartino1.png"
            },
            "IGENOA3085": {
                name: "Genova Sturla - Fonte: Wunderground - Altitudine: 74 m.s.l.m.",
                link: "Sturla1.png"
            },
            "IGENOA3052": {
                name: "Genova Boccadasse - Fonte: Wunderground - Altitudine: 41 m.s.l.m.",
                link: "Boccadasse1.png"
            }
        };

        const StazioniOMIRL = {
            "CFUNZ": {
                name: "Genova Centro Funzionale - Fonte: OMIRL - Altitudine: 25 m.s.l.m.",
                link: "CFUNZ2.png"
            }
        };


        // Legge i parametri dall'URL
        const params = new URLSearchParams(window.location.search);

        const station = params.get("station");
        const source = params.get("source");


        // Sceglie la lista corretta
        let stazione;

        if (source === "OMIRL") {
            stazione = StazioniOMIRL[station];
        } 
        else if (source === "Wunderground") {
            stazione = StazioniWunderground[station];
        }


        // Mostra l'immagine
        const gauge = document.getElementById("gauge");

        if (stazione) {
            gauge.src = stazione.link;
            gauge.alt = stazione.name;

            document.title = stazione.name;
        } 
        else {
            document.body.innerHTML = `
                <div style="
                    color: white;
                    font-family: Arial, sans-serif;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 100vh;
                    text-align: center;
                ">
                    <div>
                        <h1>Stazione non trovata</h1>
                        <p>Station: ${station || "mancante"}</p>
                        <p>Source: ${source || "mancante"}</p>
                    </div>
                </div>
            `;
        }
    </script>

</body>
</html>
