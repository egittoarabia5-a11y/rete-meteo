.gauge-tooltip {

// =========================================

// =========================================

function updateTemperatureScale() {

    // Il massimo della scala è sempre
    // il multiplo di 10 superiore al record massimo

    tempMax =
        Math.ceil(temperatureMax / 10) * 10;

    // La scala deve essere SEMPRE di 60°C

    tempMin =
        tempMax - 60;
}

// =========================================
// FUNZIONE AGGIORNAMENTO
// =========================================

function updateTemperatureGauge(
    value,
    minValue,
    maxValue
) {

    // =========================================
    // AGGIORNA MINIMO REALE
    // =========================================

    if (minValue < temperatureMin) {

        temperatureMin = minValue;

    }


    // =========================================
    // AGGIORNA MASSIMO REALE
    // =========================================

    if (maxValue > temperatureMax) {

        temperatureMax = maxValue;

    }


    // =========================================
    // RICALCOLA LA SCALA
    // =========================================

    const oldTempMin = tempMin;
    const oldTempMax = tempMax;

    updateTemperatureScale();


    // =========================================
    // AGGIORNA LA SCALA SOLO SE NECESSARIO
    // =========================================

    if (
        oldTempMin !== tempMin ||
        oldTempMax !== tempMax
    ) {

        temperatureGauge.setMinValue(
            tempMin
        );

        temperatureGauge.setMaxValue(
            tempMax
        );

    }


    // =========================================
    // CONO ROSSO MIN / MAX
    // =========================================

    temperatureGauge.setArea([

        steelseries.Section(
            temperatureMin,
            temperatureMax,
            "rgba(236, 45, 45, 0.17)"
        )

    ]);


    // =========================================
    // AGGIORNA VALORE ATTUALE
    // =========================================

    temperatureValue = value;

    temperatureGauge.setValueAnimated(
        temperatureValue
    );

}

        // Posizione iniziale

        // Annulla eventuale timer precedente

            temperatureTooltipTimer

        // Aspetta 3 secondi
        temperatureTooltipTimer =
            setTimeout(() => {

                temperatureTooltip.innerHTML = `

                    <div class="gauge-tooltip-title">
                        Temperatura:
                        <span class="gauge-tooltip-value">
                            ${temperatureValue.toFixed(1)}°
                        </span>
                    </div>

                    <div>
                        Massima:
                        ${temperatureMax.toFixed(1)}°
                        -
                        Minima:
                        ${temperatureMin.toFixed(1)}°
                    </div>

                `;

                temperatureTooltip.classList.add(
                    "visible"
                );

            }, 1000);

    }
);


// =========================================

    "mousemove",
    (event) => {

// =========================================
// SCALA DINAMICA DEWPOINT
//
// Range sempre di 60 °C
// Spostamento di 10 °C
// =========================================

function updateDewpointGauge(
    value,
    minValue,
    maxValue
) {


    // =========================================
    // AGGIORNA MINIMO REGISTRATO
    // =========================================

    if (minValue < dewpointMinRecorded) {

        dewpointMinRecorded = minValue;

    }


    // =========================================
    // AGGIORNA MASSIMO REGISTRATO
    // =========================================

    if (maxValue > dewpointMaxRecorded) {

        dewpointMaxRecorded = maxValue;

    }


    // =========================================
    // SE SUPERA IL MASSIMO
    // SPOSTA LA SCALA DI 10 °C
    // =========================================

    while (value > dewpointGaugeMax) {

        dewpointGaugeMin += dewpointStep;

        dewpointGaugeMax += dewpointStep;

    }


    // =========================================
    // SE SCENDE SOTTO IL MINIMO

    // AGGIORNA MINIMO REGISTRATO
    // =========================================

    if (minValue < percepitaMinRecorded) {

        percepitaMinRecorded =
            minValue;

    }


    // =========================================
    // AGGIORNA MASSIMO REGISTRATO
    // =========================================

    if (maxValue > percepitaMaxRecorded) {

        percepitaMaxRecorded =
            maxValue;

    }


    // =========================================
    // SALVA VALORE ATTUALE
    // =========================================

    percepitaValue =
        value;


    // =========================================
    // SCALA DINAMICA
    //
    // SEMPRE 70 °C DI AMPIEZZA
    // SPOSTAMENTO DI 10 °C
    //
    // -20 → 50
    // -10 → 60
    //   0 → 70
    //  10 → 80
    // =========================================

    while (
        value > percepitaGaugeMax
    ) {

        percepitaGaugeMin +=
            percepitaStep;

        percepitaGaugeMax +=
            percepitaStep;

    }


    while (
        value < percepitaGaugeMin
    ) {

        percepitaGaugeMin -=
            percepitaStep;

        percepitaGaugeMax -=
            percepitaStep;

    }


    // =========================================
    // AGGIORNA LA SCALA
    // =========================================

    if (
        percepitaGauge.getMinValue()
            !== percepitaGaugeMin ||

        percepitaGauge.getMaxValue()
            !== percepitaGaugeMax
    ) {

        percepitaGauge.setMinValue(
            percepitaGaugeMin
        );

        percepitaGauge.setMaxValue(
            percepitaGaugeMax
        );

    }


    // =========================================
    // AGGIORNA CONO ROSSO MIN / MAX
    // =========================================

    percepitaGauge.setArea([

        steelseries.Section(

            percepitaMinRecorded,

            percepitaMaxRecorded,

            "rgba(236, 45, 45, 0.17)"

        )

    ]);


    // =========================================
    // AGGIORNA VALORE ATTUALE
    // =========================================

    percepitaGauge.setValueAnimated(
        percepitaValue
    );

}

function updateRadGauge(value) {

    let newMax;

    if (value <= 500) {

        newMax = 500;

    }
    else if (value <= 750) {

        newMax = 750;

    }
    else if (value <= 1000) {

        newMax = 1000;

    }
    else if (value <= 1250) {

        newMax = 1250;

    }
    else if (value <= 1500) {

        newMax = 1500;

    }
    else {

        newMax =
            Math.ceil(value / 250) * 250;

    }


    if (
        RadGauge.getMaxValue() !== newMax
    ) {

        RadGauge.setMaxValue(
            newMax
        );

        RadGauge.setValue(0);

    }


    // Salva il valore attuale
    radValue = value;


    RadGauge.setValueAnimated(
        radValue
    );

}

// =========================================
// MOSTRA TOOLTIP
// =========================================

function showGaugeTooltip(
    gaugeElement,
    title,
    value,
    max,
    min,
    unit = "°"
) {

    gaugeElement.addEventListener("mouseenter", () => {

        gaugeTooltip.innerHTML = `
            <div class="gauge-tooltip-title">
                ${title}: <span class="gauge-tooltip-value">${Number(value).toFixed(1)}${unit}</span>
            </div>

            <div>
                Massima: ${Number(max).toFixed(1)}${unit}
                - Minima: ${Number(min).toFixed(1)}${unit}
            </div>
        `;

        gaugeTooltip.classList.add("visible");

    });


    gaugeElement.addEventListener("mousemove", (event) => {

        gaugeTooltip.style.left =
            (event.clientX + 15) + "px";

        gaugeTooltip.style.top =
            (event.clientY + 15) + "px";

    });


    gaugeElement.addEventListener("mouseleave", () => {

        gaugeTooltip.classList.remove("visible");

    });

}
