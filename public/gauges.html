<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stazione Meteo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    /* =========================
       ELENCO STAZIONI
       ========================= */

    #stations {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;

      padding: 12px;

      display: flex;
      gap: 8px;
      flex-wrap: wrap;

      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);

      border-bottom: 1px solid rgba(0, 0, 0, 0.15);
    }

    .station-button {
      padding: 9px 15px;

      border-radius: 8px;
      border: 1px solid #ccc;

      background: #f7f7f7;
      color: #222;

      text-decoration: none;
      cursor: pointer;

      transition: 0.2s;
      font-size: 14px;
    }

    .station-button:hover {
      background: #e8e8e8;
    }

    .station-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    /* =========================
       CONTENUTO FULL SCREEN
       ========================= */

    main {
      position: relative;

      width: 100vw;
      height: 100vh;

      margin: 0;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    /* =========================
       IMMAGINE
       ========================= */

    #stationImage {
      width: 100vw;
      height: 100vh;

      display: block;

      /*
        Contiene tutta l'immagine senza deformarla.
        Potrebbero rimanere piccole bande nere se
        il rapporto dell'immagine è diverso dallo schermo.
      */
      object-fit: contain;

      border-radius: 0;
      box-shadow: none;
    }

    /* =========================
       TITOLO / INFO
       ========================= */

    #title,
    #info {
      position: fixed;
      z-index: 5;

      left: 20px;

      color: white;

      text-shadow:
        0 2px 5px rgba(0, 0, 0, 0.8);

      pointer-events: none;
    }

    #title {
      bottom: 45px;
      margin: 0;

      font-size: 28px;
    }

    #info {
      bottom: 20px;
      margin: 0;

      font-size: 14px;
    }

    /* =========================
       ERRORE
       ========================= */

    #error {
      display: none;

      position: fixed;
      z-index: 20;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 25px;

      max-width: 90%;

      background: white;

      border-radius: 12px;

      color: #a00000;

      text-align: center;

      box-shadow: 0 5px 30px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>

  <!-- =========================
       ELENCO STAZIONI
       ========================= -->

  <div id="stations"></div>


  <!-- =========================
       CONTENUTO
       ========================= -->

  <main>

    <h1 id="title">Stazione</h1>

    <div id="info"></div>

    <div id="error"></div>

    <img
      id="stationImage"
      src=""
      alt="Immagine stazione"
    >

  </main>


  <script>

    // =========================
    // CONFIGURAZIONE STAZIONI
    // =========================

    const stationPhotos = {

      "IGENOA2897": {
        name: "IGENOA2897",
        photo: "SanMartino1.png"
      }

      // Esempio:
      //
      // "IGENOA1234": {
      //   name: "IGENOA1234",
      //   photo: "Brignole.png"
      // },
      //
      // "IGENOA5678": {
      //   name: "IGENOA5678",
      //   photo: "Nervi.png"
      // }

    };


    // =========================
    // PARAMETRI URL
    // =========================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const station =
      params.get("station");

    const source =
      params.get("source");

    const name =
      params.get("name");


    // =========================
    // ELENCO STAZIONI
    // =========================

    const stationsContainer =
      document.getElementById("stations");


    Object.entries(stationPhotos).forEach(
      ([stationId, data]) => {

        const button =
          document.createElement("a");

        button.className =
          "station-button";

        if (stationId === station) {
          button.classList.add("active");
        }

        button.textContent =
          data.name;

        const newParams =
          new URLSearchParams();

        newParams.set(
          "station",
          stationId
        );

        if (source) {
          newParams.set(
            "source",
            source
          );
        }

        newParams.set(
          "name",
          data.name
        );

        button.href =
          `${window.location.pathname}?${newParams.toString()}`;

        stationsContainer.appendChild(
          button
        );

      }
    );


    // =========================
    // ELEMENTI
    // =========================

    const title =
      document.getElementById("title");

    const info =
      document.getElementById("info");

    const image =
      document.getElementById("stationImage");

    const error =
      document.getElementById("error");


    // =========================
    // MOSTRA STAZIONE
    // =========================

    if (!station) {

      title.textContent =
        "Nessuna stazione selezionata";

      info.textContent =
        "Seleziona una stazione dall'elenco.";

      image.style.display =
        "none";

    }

    else if (!stationPhotos[station]) {

      title.textContent =
        "Stazione non trovata";

      info.textContent =
        station;

      image.style.display =
        "none";

      error.style.display =
        "block";

      error.textContent =
        `Non è configurata alcuna foto per la stazione "${station}".`;

    }

    else {

      const data =
        stationPhotos[station];


      title.textContent =
        name || data.name;


      info.textContent =
        `Station: ${station}` +
        (source
          ? ` • Source: ${source}`
          : "");


      image.src =
        data.photo;


      image.alt =
        `Foto ${data.name}`;


      image.style.display =
        "block";


      // =========================
      // ERRORE IMMAGINE
      // =========================

      image.onerror = () => {

        image.style.display =
          "none";

        error.style.display =
          "block";

        error.textContent =
          `Impossibile trovare l'immagine "${data.photo}".`;

      };

    }

  </script>

</body>
</html>
