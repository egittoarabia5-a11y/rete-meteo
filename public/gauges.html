<!DOCTYPE html>
<html lang="it">

<head>

    <title>Gauges</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SteelSeries -->
<script src="steelseries.js"></script>
<script src="steelseries_tween.js"></script>

    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: "Inter", sans-serif;
        }


        /* =========================================
           SFONDO STAZIONE
        ========================================= */

        #stationBackground {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            display: block;

            z-index: 0;
        }


        /* =========================================
           BARRA SUPERIORE
        ========================================= */

        .top-bar {

            position: fixed;

            top: 14px;
            left: 14px;
            right: 14px;

            height: 64px;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 0 24px;

            border-radius: 32px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.30),
                    rgba(255,255,255,0.12) 45%,
                    rgba(255,255,255,0.20)
                );

            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);

            border: 1px solid rgba(255,255,255,0.35);

            box-shadow:
                inset 0 -1px 2px rgba(0,0,0,0.15),
                0 8px 30px rgba(0,0,0,0.25);

            color: white;

            z-index: 1000;
        }


        /* =========================================
           NOME STAZIONE
        ========================================= */

        .station-name {

            font-size: 26px;

            font-weight: 600;

            letter-spacing: -0.03em;

            text-align: center;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            width: 100%;
        }


        /* =========================================
           GRIGLIA DEI 15 RIQUADRI
        ========================================= */

        .boxes {

            position: fixed;

            top: 95px;

            left: 10%;
            right: 10%;

            bottom: 14px;

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            grid-template-rows: repeat(3, 1fr);

            gap: 14px;

            z-index: 900;
        }


        /* =========================================
           RIQUADRO GLASS
        ========================================= */

        .glass-box {

            width: 100%;
            height: 100%;

            border-radius: 28px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.30),
                    rgba(255,255,255,0.12) 45%,
                    rgba(255,255,255,0.20)
                );

            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);

            border: 1px solid rgba(255,255,255,0.22);

            box-shadow:

                inset 0 1px 1px rgba(255,255,255,0.25),

                inset 0 -1px 2px rgba(0,0,0,0.15),

                0 8px 30px rgba(0,0,0,0.25);

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        /* =========================================
           CANVAS GAUGE
        ========================================= */

.gauge-canvas {
    display: block;
}

    </style>

</head>

        ========================================= */

        };



        /* =========================================
           PARAMETRI URL
        ========================================= */

        const params =
            new URLSearchParams(window.location.search);


        const station =
            params.get("station");


        const source =
            params.get("source");



        /* =========================================
           SCELTA DELLA STAZIONE
        ========================================= */

        let stazione = null;


        if (source === "OMIRL") {

            stazione =
                StazioniOMIRL[station];

        }


        else if (source === "Wunderground") {

            stazione =
                StazioniWunderground[station];

        }



        /* =========================================
           ELEMENTI HTML
        ========================================= */

        const stationName =
            document.getElementById("stationName");


        const stationBackground =
            document.getElementById("stationBackground");



        /* =========================================
           CARICAMENTO STAZIONE
        ========================================= */

        if (stazione) {


            /* Nome stazione */

            stationName.textContent =
                stazione.name;


            /* Titolo pagina */

            document.title =
                stazione.name;


            /* Sfondo PNG */

            stationBackground.src =
                stazione.link;

        }


        else {


            /* Stazione non trovata */

            stationName.textContent =
                "Stazione non trovata";


            stationBackground.style.display =
                "none";
