/* =========================================

========================================= */

.gauge-tooltip {
    position: fixed;

    background: rgb(160, 160, 160);

    border: 1px solid #d6d6d6;
    color: #ffffff;

    padding: 10px 14px;

    border-radius: 8px;

    font-family: "Inter", sans-serif;
    font-size: 13px;
    line-height: 1.5;

    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.18);

    pointer-events: none;

    z-index: 999999;

    opacity: 0;

    transition: opacity 0.12s ease;

    white-space: nowrap;
}

.gauge-tooltip.visible {
    opacity: 1;
}

.gauge-tooltip-title {
    font-weight: 700;
    font-size: 14px;
}

.gauge-tooltip-value {
    font-weight: 700;
}
.top-bar {
    position: fixed;

    top: 14px;
    left: 14px;
    right: 14px;

    height: 64px;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 0 24px;

    border-radius: 32px;

    background: rgb(160, 160, 160);

    border: 1px solid #d6d6d6;

    box-shadow: none;

    color: white;

    z-index: 99999;

    opacity: 1;

    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}


        /* =========================================
           NOME STAZIONE
        ========================================= */

        .station-name {

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        /* =========================================
           GRIGLIA DEI 15 RIQUADRI
        ========================================= */

 .boxes {
    position: fixed;

    top: 95px;
    left: 10%;
    right: 10%;
    bottom: 14px;

    display: grid;

    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);

    gap: 14px;

    z-index: 900;

    pointer-events: none;
}



        /* =========================================
           RIQUADRO GLASS
        ========================================= */

        .glass-box {
    width: 100%;
    height: 100%;

    background: transparent;
    border: none;
    box-shadow: none;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: visible;
}


        /* =========================================
           CANVAS GAUGE
        ========================================= */

/* =========================================
   CANVAS GAUGE
========================================= */

.gauge-canvas {
    display: block !important;

    width: 265px !important;
    height: 265px !important;

    min-width: 265px !important;
    min-height: 265px !important;

    max-width: 265px !important;
    max-height: 265px !important;

    flex: 0 0 265px !important;

    position: relative;

    z-index: 1;

    /* RIATTIVA IL MOUSE SUL GAUGE */
    pointer-events: auto !important;
}

    try {

        // =========================================

        // =========================================

        const stationData = StazioniWunderground[id];

        if (!stationData) {

            console.error(
                "🔴 Stazione Wunderground non trovata:",
                id
            );

            return;
        }


        // =========================================
        // FETCH DATI ATTUALI
        // =========================================

        const urlCurrent =
            `https://api.weather.com/v2/pws/observations/current?apiKey=${apiKey}&stationId=${stationData.api}&numericPrecision=decimal&format=json&units=m`;

        const resCurrent =
            await fetch(urlCurrent);

        if (!resCurrent.ok) {

            throw new Error(
                `HTTP ${resCurrent.status}`
            );

        }

        const dataCurrent =
            await resCurrent.json();

        if (
            !dataCurrent.observations ||
            !dataCurrent.observations.length
        ) {

            throw new Error(
                "Nessuna osservazione ricevuta"
            );

        }

        const observation =
            dataCurrent.observations[0];


        // =========================================
        // DATI ATTUALI
        // =========================================

        const temp =
            observation.metric?.temp ?? null;

        const dewp =
            observation.metric?.dewpt ?? null;

        const heat =
            observation.metric?.heatIndex ?? null;

        const hum =
            observation.humidity ?? null;

        const rainDaily =
            observation.metric?.precipTotal ?? null;

        const rainRate =
            observation.metric?.precipRate ?? null;

        const lat =
            observation.lat ?? null;

        const lon =
            observation.lon ?? null;

        const wind =
            observation.metric?.windSpeed ?? null;

        const windGust =
            observation.metric?.windGust ?? null;

        const altitude =
            observation.metric?.elev ?? null;

        const windDir =
            observation.winddir ?? null;

        const pressure =
            observation.metric?.pressure ?? null;

        const uv =
            observation.uv ?? null;

        const rad =
            observation.solarRadiation ?? null;


        // =========================================
        // LOG DATI ATTUALI
        // =========================================

        console.log(
            "🔵 CURRENT WUNDERGROUND:",
            {
                id,
                temp,
                dewp,
                heat,
                hum,
                pressure,
                wind,
                windGust
            }
        );


        // =========================================

        // =========================================

        const urlDaily =
            `https://api.weather.com/v2/pws/dailysummary/1day?apiKey=${apiKey}&stationId=${stationData.api}&numericPrecision=decimal&format=json&units=m`;

        const resDaily =
            await fetch(urlDaily);

        if (!resDaily.ok) {

            throw new Error(
                `HTTP Daily ${resDaily.status}`
            );

        }

        const dataDaily =
            await resDaily.json();


        // =========================================
        // SUMMARY
        // =========================================

        const summary =
            dataDaily.summaries &&
            dataDaily.summaries.length > 0
                ? dataDaily.summaries[0]
                : null;

        const summaryMetric =
            summary?.metric ?? null;


        console.log(

function updateTemperatureGauge(
    value,
    minValue,
    maxValue
) {

    console.log("🔴 updateTemperatureGauge RICEVE:", {
        value,
        minValue,
        maxValue
    });

    // =========================================
    // CONVERSIONE NUMERI
    // =========================================

    const currentTemp = Number(value);
    const currentMin = Number(minValue);
    const currentMax = Number(maxValue);


    console.log("🟣 VALORI CONVERTITI:", {
        currentTemp,
        currentMin,
        currentMax
    });


    // =========================================
    // TEMPERATURA ATTUALE
    // =========================================

    if (Number.isFinite(currentTemp)) {

        temperatureValue =
            currentTemp;

    }


    // =========================================
    // MINIMA DAL FETCH
    // =========================================

    if (Number.isFinite(currentMin)) {

        temperatureMin =
            currentMin;

    }


    // =========================================
    // MASSIMA DAL FETCH
    // =========================================

    if (Number.isFinite(currentMax)) {

        temperatureMax =
            currentMax;

    }


    // =========================================
    // DEBUG
    // =========================================

    console.log("🌡️ TEMPERATURE GLOBALI:", {
        temperatureValue,
        temperatureMin,
        temperatureMax
    });


    // =========================================
    // RICALCOLA SCALA
    // =========================================

    const oldTempMin =
        tempMin;

    const oldTempMax =
        tempMax;


    updateTemperatureScale();


    // =========================================
    // AGGIORNA SCALA GAUGE
    // =========================================

    if (
        oldTempMin !== tempMin ||
        oldTempMax !== tempMax
    ) {

        console.log("📏 NUOVA SCALA:", {
            min: tempMin,
            max: tempMax
        });

        temperatureGauge.setMinValue(
            tempMin
        );

        temperatureGauge.setMaxValue(
            tempMax
        );

    }


    // =========================================
    // AREA MIN → MAX
    // =========================================

    if (
        Number.isFinite(temperatureMin) &&
        Number.isFinite(temperatureMax)
    ) {

        console.log(
            "🔴 CONO MIN/MAX:",
            temperatureMin,
            "→",
            temperatureMax
        );

        temperatureGauge.setArea([

            steelseries.Section(
                temperatureMin,
                temperatureMax,
                "rgba(236, 45, 45, 0.17)"
            )

        ]);

    }


    // =========================================
    // VALORE ATTUALE
    // =========================================

    if (
        Number.isFinite(temperatureValue)
    ) {

        console.log(
            "➡️ VALORE GAUGE:",
            temperatureValue
        );

        temperatureGauge.setValueAnimated(
            temperatureValue
        );

    }

}

        tempMin = -20;
        tempMax = 40;

        tempMax = 40;

        return;

    // =========================================
    // OLTRE 40°C

    tempMax =
        Math.ceil(temperatureMax / 10) * 10;

    tempMin =
        tempMax - 60;


    console.log("📏 SCALA TEMPERATURA:", {
        temperaturaMassima: temperatureMax,
        scalaMin: tempMin,
        scalaMax: tempMax
    });

}

//
// Range sempre di 60 °C
// Spostamento di 10 °C
// =========================================

// =========================================
// CALCOLO HUMIDEX
// =========================================

function calculateHumidex(
    temperature,
    dewpoint
) {

    const T =
        Number(temperature);

    const Td =
        Number(dewpoint);


    if (
        !Number.isFinite(T) ||
        !Number.isFinite(Td)
    ) {

        console.warn(
            "❌ Humidex: dati non validi",
            {
                temperature,
                dewpoint
            }
        );

        return null;

    }


    // =====================================
    // PRESSIONE DI VAPORE
    // =====================================

    const e =
        6.11 *
        Math.exp(
            5417.753 *
            (
                (1 / 273.16) -
                (1 / (273.15 + Td))
            )
        );


    // =====================================
    // FORMULA HUMIDEX
    // =====================================

    const humidex =
        T +
        0.5555 *
        (e - 10);


    return humidex;

}


// =========================================
// AGGIORNAMENTO GAUGE HUMIDEX
// =========================================

function updateHumidexGauge(
    temperature,
    dewpoint
) {


    // =========================================
    // CALCOLA HUMIDEX
    // =========================================

    const value =
        calculateHumidex(
            temperature,
            dewpoint
        );


    if (
        !Number.isFinite(value)
    ) {

        console.warn(
            "❌ Humidex non aggiornato"
        );

        return;

    }


    // =========================================
    // VALORE ATTUALE
    // =========================================

    humidexValue =
        value;


    // =========================================
    // MINIMA = VALORE ATTUALE
    // MASSIMA = VALORE ATTUALE
    // =========================================

    humidexMinRecorded =
        value;

    humidexMaxRecorded =
        value;


    // =========================================
    // SCALA DINAMICA
    // =========================================

    while (
        value >
        humidexGaugeMax
    ) {

        humidexGaugeMin +=
            humidexStep;

        humidexGaugeMax +=
            humidexStep;

    }


    while (
        value <
        humidexGaugeMin
    ) {

        humidexGaugeMin -=
            humidexStep;

        humidexGaugeMax -=
            humidexStep;

    }


    // =========================================
    // AGGIORNA SCALA
    // =========================================

    if (
        humidexGauge.getMinValue() !==
            humidexGaugeMin ||

        humidexGauge.getMaxValue() !==
            humidexGaugeMax
    ) {

        humidexGauge.setMinValue(
            humidexGaugeMin
        );

        humidexGauge.setMaxValue(
            humidexGaugeMax
        );

    }


    // =========================================
    // CONO ROSSO
    // =========================================

    humidexGauge.setArea([

        steelseries.Section(

// =========================================
// CALCOLO TEMPERATURA APPARENTE
// =========================================

function calculateApparentTemperature(
    temperature,
    dewpoint,
    wind
) {

    const T =
        Number(temperature);

    const Td =
        Number(dewpoint);

    const V =
        Number(wind);


    if (
        !Number.isFinite(T) ||
        !Number.isFinite(Td) ||
        !Number.isFinite(V)
    ) {

        console.warn(
            "❌ Temperatura apparente: dati non validi",
            {
                temperature,
                dewpoint,
                wind
            }
        );

        return null;

    }


    // =========================================
    // PRESSIONE DI VAPORE
    // =========================================

    const e =
        6.105 *
        Math.exp(
            17.27 * Td /
            (237.7 + Td)
        );


    // =========================================
    // TEMPERATURA APPARENTE
    // =========================================

    const apparentTemperature =
        T +
        0.33 * e -
        0.70 * V -
        4.00;


    return apparentTemperature;

}


// =========================================
// AGGIORNAMENTO GAUGE
// =========================================

function updatePercepitaGauge(
    temperature,
    dewpoint,
    wind
) {

    // =========================================
    // CALCOLA TEMPERATURA APPARENTE
    // =========================================

    const value =
        calculateApparentTemperature(
            temperature,
            dewpoint,
            wind
        );


    if (
        !Number.isFinite(value)
    ) {

        console.warn(
            "❌ Temperatura apparente non aggiornata"
        );

        return;

    }


    // =========================================
    // VALORE ATTUALE
    // =========================================

    percepitaValue =
        value;


    // =========================================
    // MINIMA = VALORE ATTUALE
    // MASSIMA = VALORE ATTUALE
    // =========================================

    percepitaMinRecorded =
        value;

    percepitaMaxRecorded =
        value;


    // =========================================
    // SCALA DINAMICA
    // =========================================

    while (
        value > percepitaGaugeMax
    ) {

        percepitaGaugeMin +=
            percepitaStep;

        percepitaGaugeMax +=
            percepitaStep;

    }


    while (
        value < percepitaGaugeMin
    ) {

        percepitaGaugeMin -=
            percepitaStep;

        percepitaGaugeMax -=
            percepitaStep;

    }


    // =========================================
    // AGGIORNA SCALA
    // =========================================

    if (
        percepitaGauge.getMinValue()
            !== percepitaGaugeMin ||

        percepitaGauge.getMaxValue()
            !== percepitaGaugeMax
    ) {

        percepitaGauge.setMinValue(
            percepitaGaugeMin
        );

        percepitaGauge.setMaxValue(
            percepitaGaugeMax
        );

    }


    // =========================================
    // CONO ROSSO
    // =========================================

    percepitaGauge.setArea([

        steelseries.Section(
            percepitaMinRecorded,
            percepitaMaxRecorded,
            "rgba(236, 45, 45, 0.17)"
        )

    ]);


    // =========================================
    // AGGIORNA VALORE
    // =========================================

    percepitaGauge.setValueAnimated(
        percepitaValue
    );


    // =========================================
    // DEBUG
    // =========================================

    console.log(
        "🌡️ TEMPERATURA APPARENTE:",
        {
            temperatura: temperature,
            dewpoint: dewpoint,
            vento: wind,
            valore: percepitaValue,
            minima: percepitaMinRecorded,
            massima: percepitaMaxRecorded
        }
    );

}

// =========================================
// SCALA DINAMICA RADIAZIONE
//
// 0 → 500
// 500 → 750
// 750 → 1000
// 1000 → 1250
// 1250 → 1500
// ecc.
//
// LA SCALA DIPENDE DA radHigh
// =========================================

// =========================================
// AGGIORNA GAUGE RADIAZIONE SOLARE
// =========================================

function updateRadGauge(

    value,
    maxValue

) {

    const rad =
        Number(value);

    const radHigh =
        Number(maxValue);


    // =========================================
    // CONTROLLO VALORE ATTUALE
    // =========================================

    if (!Number.isFinite(rad)) {

        console.warn(
            "🔴 RADIAZIONE NON VALIDA:",
            value
        );

        return;

    }


    // =========================================
    // CALCOLO SCALA IN BASE A radHigh
    // =========================================

    let newMax;


    if (Number.isFinite(radHigh)) {

        if (radHigh <= 500) {

            newMax = 500;

        }

        else {

            newMax =
                Math.ceil(
                    radHigh / 250
                ) * 250;

        }

    }

    else {

        if (rad <= 500) {

            newMax = 500;

        }

        else {

            newMax =
                Math.ceil(
                    rad / 250
                ) * 250;

        }

    }


    // =========================================
    // VERIFICA SE LA SCALA CAMBIA
    // =========================================

    const scaleChanged =
        RadGauge.getMaxValue() !== newMax;


    // =========================================
    // AGGIORNA LA SCALA
    // =========================================

    if (scaleChanged) {

        RadGauge.setMaxValue(
            newMax
        );

    }


    radGaugeMax =
        newMax;


    // =========================================
    // SALVA VALORE ATTUALE
    // =========================================

    radValue =
        rad;


    // =========================================
    // SALVA MASSIMA
    // =========================================

    radMaxRecorded =
        Number.isFinite(radHigh)
            ? radHigh
            : null;


    // =========================================
    // THRESHOLD = radHigh
    // =========================================

    if (Number.isFinite(radHigh)) {

        RadGauge.setThreshold(
            radHigh
        );

    }


    // =========================================
    // AGGIORNA IL VALORE
    // =========================================

    if (scaleChanged) {

        // Se la scala cambia,
        // mantieni subito il puntatore
        // sul valore attuale.

        RadGauge.setValue(
            radValue
        );

    }

    else {

        // Se la scala NON cambia,
        // usa l'animazione normale.

        RadGauge.setValueAnimated(
            radValue
        );

    }


    // =========================================
    // LOG
    // =========================================

    console.log(
        "🟣 RADIAZIONE GAUGE:",
        {

            rad:
                radValue,

            radHigh:
                radMaxRecorded,

            scalaMin:
                0,

            scalaMax:
                radGaugeMax,

            threshold:
                radHigh

        }
    );

}

function createRainfallSections(metric, maxValue = 500) {

    const factor = metric ? 1 : 1 / 25;

    // Punti di riferimento della scala originale
    const stops = [
        {
            value: 0,
            color: [0, 250, 0]
        },

        {
            value: 10,
            color: [218, 246, 0]
        },

        {
            value: 25,
            color: [250, 186, 0]
        },

        {
            value: 40,
            color: [250, 95, 0]
        },

        {
            value: 50,
            color: [250, 0, 0]
        },

        {
            value: 65,
            color: [250, 6, 80]
        },

        {
            value: 75,
            color: [205, 18, 158]
        },

        {
            value: 100,
            color: [0, 0, 250]
        },

        {
            value: 125,
            color: [0, 219, 212]
        },

        {
            value: 500,
            color: [0, 219, 212]
        }

    ];


    // =========================================
    // INTERPOLAZIONE COLORE
    // =========================================

    function interpolateColor(value) {

        // Prima del primo stop
        if (value <= stops[0].value) {

            return stops[0].color;

        }


        // Dopo l'ultimo stop
        if (value >= stops[stops.length - 1].value) {

            return stops[stops.length - 1].color;

        }


        // Cerca i due punti tra cui interpolare
        for (let i = 0; i < stops.length - 1; i++) {

            const a = stops[i];
            const b = stops[i + 1];


            if (
                value >= a.value &&
                value <= b.value
            ) {

                const t =
                    (value - a.value) /
                    (b.value - a.value);


                const r =
                    Math.round(
                        a.color[0] +
                        (b.color[0] - a.color[0]) * t
                    );

                const g =
                    Math.round(
                        a.color[1] +
                        (b.color[1] - a.color[1]) * t
                    );

                const blue =
                    Math.round(
                        a.color[2] +
                        (b.color[2] - a.color[2]) * t
                    );


                return [
                    r,
                    g,
                    blue
                ];

            }

        }


        return [0, 219, 212];

    }


    // =========================================
    // CREA UNA SECTION PER OGNI TACCA
    // =========================================

    const sections = [];

    const step = 1;


    for (
        let value = 0;
        value < maxValue;
        value += step
    ) {

        const start =
            value * factor;

        const stop =
            Math.min(
                value + step,
                maxValue
            ) * factor;


const color =
    interpolateColor(
        value + 0.5
    );


        sections.push(

            steelseries.Section(
                start,
                stop,
                `rgba(
                    ${color[0]},
                    ${color[1]},
                    ${color[2]},
                    1
                )`
            )

        );

    }


    return sections;

}

    else if (value <= 500) {

    }
    else if (value <= 750) {

    }
    else if (value <= 1000) {

    }
    else if (value <= 1500) {

        newMax = 1500;

    }
    else {

        newMax =
            Math.ceil(value / 500) * 500;

    }


    // =========================================
    // CAMBIO SCALA
    // =========================================

    if (
        RainGauge.getMaxValue() !== newMax
    ) {

        console.log(
            "📏 SCALA PRECIPITAZIONI:",
            {
                valore: value,
                vecchiaScala:
                    RainGauge.getMaxValue(),
                nuovaScala:
                    newMax
            }
        );


        // Cambio scala
        RainGauge.setMaxValue(
            newMax
        );


        // Ricrea le sezioni per la nuova scala
        if (
            typeof RainGauge.setSections ===
            "function"
        ) {

            RainGauge.setSections(
                createRainfallSections(
                    true,
                    newMax
                )
            );

        }

    }


    // =========================================
    // SALVA VALORE
    // =========================================

    rainValue =
        value;


    // =========================================
    // MANTIENE IL VALORE ATTUALE
    // =========================================

    RainGauge.setValue(
        rainValue
    );


    console.log(
        "🌧️ PRECIPITAZIONI GAUGE AGGIORNATO:",
        rainValue
    );

}

// FORMULA:
// CLOUD BASE ≈ 125 × (T - Td)
// =========================================

function updateCloudBaseGauge(
    temperature,
    dewpoint
) {

    const temp =
        Number(temperature);

    const dewp =
        Number(dewpoint);


    console.log(
        "☁️ CLOUD BASE - DATI RICEVUTI:",
        {
            temperatura: temperature,
            dewpoint: dewpoint
        }
    );


    if (
        !Number.isFinite(temp) ||
        !Number.isFinite(dewp)
    ) {

        console.warn(
            "🔴 CLOUD BASE NON CALCOLABILE:",
            {
                temperatura: temperature,
                dewpoint: dewpoint
            }
        );

        return;
    }


    // =========================================
    // CALCOLO LCL
    // =========================================

    const cloudBase =
        125 * (temp - dewp);


    console.log(
        "☁️ CLOUD BASE - CALCOLO:",
        {
            temperatura: temp,
            dewpoint: dewp,
            differenza: temp - dewp,
            cloudBase: cloudBase
        }
    );


    // =========================================
    // EVITA VALORI NEGATIVI
    // =========================================

    cloudBaseValue =
        Math.max(0, cloudBase);


    // =========================================
    // SCALA DINAMICA
    // 0 → 1000 → 2000 → 3000 → ...
    // =========================================

    let newMax;


    if (cloudBaseValue <= 1000) {

        newMax = 1000;

    }
    else {

        newMax =
            Math.ceil(
                cloudBaseValue / 1000
            ) * 1000;

    }


    console.log(
        "☁️ CLOUD BASE - SCALA:",
        {
            valore: cloudBaseValue,
            scalaMassima: newMax
        }
    );


    if (
        CloudBaseGauge.getMaxValue() !== newMax
    ) {

        CloudBaseGauge.setMaxValue(
            newMax
        );

        CloudBaseGauge.setValue(
            0
        );

    }


    // =========================================
    // AGGIORNA GAUGE
    // =========================================

    CloudBaseGauge.setValueAnimated(
        cloudBaseValue
    );

}

        return;
    }


    stationOnline =
        online;


    if (online) {

        stationStatusElement.textContent =
            ` - 🟢 Online   -  Aggiorna in: ${stationSecondsRemaining} sec.`;

    }

    else {

        stationStatusElement.textContent =
            ` - 🔴 Offline     Riprovo tra: ${stationSecondsRemaining} sec.`;

    }

}


// =========================================
// COUNTDOWN
// =========================================

function startStationCountdown() {

    clearInterval(
        stationCountdownTimer
    );


    stationSecondsRemaining =
        10;


    updateStationStatus(
        stationOnline
    );


    stationCountdownTimer =
        setInterval(() => {

            stationSecondsRemaining--;


            if (
                stationSecondsRemaining < 0
            ) {

                stationSecondsRemaining = 0;

            }


            updateStationStatus(
                stationOnline
            );


            if (
                stationSecondsRemaining <= 0
            ) {

                clearInterval(
                    stationCountdownTimer
                );

            }

        }, 1000);

}


// =========================================
// AGGIORNAMENTO AUTOMATICO
// =========================================

async function refreshStationData() {

    console.log(
        "🔄 AGGIORNAMENTO AUTOMATICO:",
        station
    );


    try {

        if (!station) {

            console.warn(
                "⚠️ Nessuna stazione selezionata"
            );

            updateStationStatus(
                false
            );

            return;

        }


        // =====================================
        // FETCH WUNDERGROUND
        // =====================================

        await fetchPws(
            station
        );


        // =====================================
        // FETCH RIUSCITO
        // =====================================

        console.log(
            "🟢 AGGIORNAMENTO RIUSCITO:",
            station
        );


        updateStationStatus(
            true
        );

    }


    catch (error) {

        console.error(
            "🔴 ERRORE AGGIORNAMENTO:",
            error
        );


        updateStationStatus(
            false
        );

    }


    // =========================================
    // RIPARTE IL COUNTDOWN
    // =========================================

    startStationCountdown();


    // =========================================
    // PROGRAMMA PROSSIMO FETCH
    // =========================================

    clearTimeout(
        stationRefreshTimer
    );


    stationRefreshTimer =
        setTimeout(
            refreshStationData,
            10000
        );

}


// =========================================
// AVVIO AUTO-REFRESH
// =========================================

function startStationAutoRefresh() {

    console.log(
        "🚀 AUTO-REFRESH AVVIATO"
    );


    clearTimeout(
        stationRefreshTimer
    );


    clearInterval(
        stationCountdownTimer
    );


    stationSecondsRemaining =
        10;


    stationOnline =
        true;


    createStationStatus();


    updateStationStatus(
        true
    );


    startStationCountdown();


    stationRefreshTimer =
        setTimeout(
            refreshStationData,
            10000
        );

}


// =========================================
// AVVIO
// =========================================

createStationStatus();

startStationAutoRefresh();
    </script>
