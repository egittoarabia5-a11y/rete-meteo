async function fetchPws(id) {

    try {

        // =========================================
        // VERIFICA STAZIONE
        // =========================================

        const stationData =
            StazioniWunderground[id];

        if (!stationData) {

            console.error(
                "Stazione Wunderground non trovata:",
                id
            );

            return;
        }


        // =========================================
        // FETCH DATI ATTUALI
        // =========================================

        const urlCurrent =
            `https://api.weather.com/v2/pws/observations/current?apiKey=${apiKey}&stationId=${stationData.api}&numericPrecision=decimal&format=json&units=m`;


        const resCurrent =
            await fetch(urlCurrent);


        if (!resCurrent.ok) {

            throw new Error(
                `HTTP ${resCurrent.status}`
            );

        }


        const dataCurrent =
            await resCurrent.json();


        if (
            !dataCurrent.observations ||
            !dataCurrent.observations.length
        ) {

            throw new Error(
                "Nessuna osservazione ricevuta"
            );

        }


        const observation =
            dataCurrent.observations[0];


        // =========================================
        // DATI ATTUALI
        // =========================================

        const temp =
            observation.metric.temp;

        const dewp =
            observation.metric.dewpt;

        const heat =
            observation.metric.heatIndex;

        const hum =
            observation.humidity;

        const rainDaily =
            observation.metric.precipTotal;

        const rainRate =
            observation.metric.precipRate;

        const lat =
            observation.lat;

        const lon =
            observation.lon;

        const wind =
            observation.metric.windSpeed;

        const windGust =
            observation.metric.windGust;

        const altitude =
            observation.metric.elev;

        const windDir =
            observation.winddir;


        // =========================================
        // FETCH DATI GIORNALIERI
        // =========================================

        const urlDaily =
            `https://api.weather.com/v2/pws/dailysummary/1day?apiKey=${apiKey}&stationId=${stationData.api}&numericPrecision=decimal&format=json&units=m`;


        const resDaily =
            await fetch(urlDaily);


        if (!resDaily.ok) {

            throw new Error(
                `HTTP Daily ${resDaily.status}`
            );

        }


        const dataDaily =
            await resDaily.json();


        const summary =
            dataDaily.summaries &&
            dataDaily.summaries.length > 0
                ? dataDaily.summaries[0].metric
                : null;


const tempHigh =
    summary ? summary.tempHigh : null;

const tempLow =
    summary ? summary.tempLow : null;

console.log("🔵 DAILY SUMMARY RAW:", summary);
console.log("🔵 tempHigh RAW:", tempHigh, typeof tempHigh);
console.log("🔵 tempLow RAW:", tempLow, typeof tempLow);

        const dewpHigh =
            summary ? summary.dewptHigh : null;

        const dewpLow =
            summary ? summary.dewptLow : null;

        const heatHigh =
            summary ? summary.heatindexHigh : null;

        const heatLow =
            summary ? summary.heatindexLow : null;

        const humHigh =
            summary

            summary

                : null;

        const windGustHigh =

function updateTemperatureGauge(
    value,
    minValue,
    maxValue
) {

    console.log("🔴 updateTemperatureGauge RICEVE:", {
        value,
        minValue,
        maxValue
    });

    // =========================================
    // CONVERSIONE NUMERI
    // =========================================

    const currentTemp = Number(value);
    const currentMin = Number(minValue);
    const currentMax = Number(maxValue);


    console.log("🟣 VALORI CONVERTITI:", {
        currentTemp,
        currentMin,
        currentMax
    });


    // =========================================
    // TEMPERATURA ATTUALE
    // =========================================

    if (Number.isFinite(currentTemp)) {

        temperatureValue =
            currentTemp;

    }


    // =========================================
    // MINIMA DAL FETCH
    // =========================================

    if (Number.isFinite(currentMin)) {

        temperatureMin =
            currentMin;

    }


    // =========================================
    // MASSIMA DAL FETCH
    // =========================================

    if (Number.isFinite(currentMax)) {

        temperatureMax =
            currentMax;

    }


    // =========================================
    // DEBUG
    // =========================================

    console.log("🌡️ TEMPERATURE GLOBALI:", {
        temperatureValue,
        temperatureMin,
        temperatureMax
    });


    // =========================================
    // RICALCOLA SCALA
    // =========================================

    const oldTempMin =
        tempMin;

    const oldTempMax =
        tempMax;


    updateTemperatureScale();


    // =========================================
    // AGGIORNA SCALA GAUGE
    // =========================================

    if (
        oldTempMin !== tempMin ||
        oldTempMax !== tempMax
    ) {

        console.log("📏 NUOVA SCALA:", {
            min: tempMin,
            max: tempMax
        });

        temperatureGauge.setMinValue(
            tempMin
        );

        temperatureGauge.setMaxValue(
            tempMax
        );

    }


    // =========================================
    // AREA MIN → MAX
    // =========================================

    if (
        Number.isFinite(temperatureMin) &&
        Number.isFinite(temperatureMax)
    ) {

        console.log(
            "🔴 CONO MIN/MAX:",
            temperatureMin,
            "→",
            temperatureMax
        );

        temperatureGauge.setArea([

            steelseries.Section(
                temperatureMin,
                temperatureMax,
                "rgba(236, 45, 45, 0.17)"
            )

        ]);

    }


    // =========================================
    // VALORE ATTUALE
    // =========================================

    if (
        Number.isFinite(temperatureValue)
    ) {

        console.log(
            "➡️ VALORE GAUGE:",
            temperatureValue
        );

        temperatureGauge.setValueAnimated(
            temperatureValue
        );

    }

}

function updateTemperatureScale() {

    // =========================================
    // SCALA STANDARD
    // =========================================

    if (!Number.isFinite(temperatureMax)) {

        tempMin = -20;
        tempMax = 40;

        return;
    }


    // =========================================
    // MASSIMO FINO A 40°C
    // =========================================

    if (temperatureMax <= 40) {

        tempMin = -20;
        tempMax = 40;

        return;
    }


    // =========================================
    // OLTRE 40°C
    // =========================================

    tempMax =
        Math.ceil(temperatureMax / 10) * 10;

    tempMin =
        tempMax - 60;


    console.log("📏 SCALA TEMPERATURA:", {
        temperaturaMassima: temperatureMax,
        scalaMin: tempMin,
        scalaMax: tempMax
    });

}

// =========================================
// SCALA DINAMICA DEWPOINT
//
// Range sempre di 60 °C
// Spostamento di 10 °C
// =========================================

function updateDewpointGauge(
    value,
    minValue,
    maxValue
) {

    // =========================================
    // CONVERSIONE NUMERICA
    // =========================================

    const currentValue = Number(value);
    const currentMin = Number(minValue);
    const currentMax = Number(maxValue);


    console.log(
        "🔵 DEWPOINT RICEVUTO:",
        {
            attuale: value,
            minima: minValue,
            massima: maxValue
        }
    );


    // =========================================
    // VALORE ATTUALE
    // =========================================

    if (Number.isFinite(currentValue)) {

        dewpointValue = currentValue;

    }


    // =========================================
    // MINIMA
    // =========================================

    if (Number.isFinite(currentMin)) {

        dewpointMinRecorded = currentMin;

    }


    // =========================================
    // MASSIMA
    // =========================================

    if (Number.isFinite(currentMax)) {

        dewpointMaxRecorded = currentMax;

    }


    console.log(
        "🟢 DEWPOINT SALVATO:",
        {
            attuale: dewpointValue,
            minima: dewpointMinRecorded,
            massima: dewpointMaxRecorded
        }
    );


    // =========================================
    // SCALA
    // =========================================

    while (
        dewpointValue > dewpointGaugeMax
    ) {

        dewpointGaugeMin += dewpointStep;
        dewpointGaugeMax += dewpointStep;

    }


    while (
        dewpointValue < dewpointGaugeMin
    ) {

        dewpointGaugeMin -= dewpointStep;
        dewpointGaugeMax -= dewpointStep;

    }


    // =========================================
    // AGGIORNA SCALA
    // =========================================

    if (
        dewpointGauge.getMinValue() !== dewpointGaugeMin ||
        dewpointGauge.getMaxValue() !== dewpointGaugeMax
    ) {

        dewpointGauge.setMinValue(
            dewpointGaugeMin
        );

        dewpointGauge.setMaxValue(
            dewpointGaugeMax
        );

    }


    // =========================================
    // CONO MIN → MAX
    // =========================================

    if (
        Number.isFinite(dewpointMinRecorded) &&
        Number.isFinite(dewpointMaxRecorded)
    ) {

        console.log(
            "🔴 DEWPOINT CONO:",
            dewpointMinRecorded,
            "→",
            dewpointMaxRecorded
        );

        dewpointGauge.setArea([

            steelseries.Section(
                dewpointMinRecorded,
                dewpointMaxRecorded,
                "rgba(236, 45, 45, 0.17)"
            )

        ]);

    }


    // =========================================
    // AGGIORNA VALORE
    // =========================================

    if (
        Number.isFinite(dewpointValue)
    ) {

        dewpointGauge.setValueAnimated(
            dewpointValue
        );

    }

}

// =========================================
// CALCOLO HUMIDEX
// =========================================

function calculateHumidex(
    temperature,
    dewpoint
) {

    const T =
        Number(temperature);

    const Td =
        Number(dewpoint);


    if (
        !Number.isFinite(T) ||
        !Number.isFinite(Td)
    ) {

        console.warn(
            "❌ Humidex: dati non validi",
            {
                temperature,
                dewpoint
            }
        );

        return null;

    }


    // =====================================
    // PRESSIONE DI VAPORE
    // =====================================

    const e =
        6.11 *
        Math.exp(
            5417.753 *
            (
                (1 / 273.16) -
                (1 / (273.15 + Td))
            )
        );


    // =====================================
    // FORMULA HUMIDEX
    // =====================================

    const humidex =
        T +
        0.5555 *
        (e - 10);


    return humidex;

}


// =========================================
// AGGIORNAMENTO GAUGE HUMIDEX
// =========================================

function updateHumidexGauge(
    temperature,
    dewpoint
) {


    // =========================================
    // CALCOLA HUMIDEX
    // =========================================

    const value =
        calculateHumidex(
            temperature,
            dewpoint
        );


    if (
        !Number.isFinite(value)
    ) {

        console.warn(
            "❌ Humidex non aggiornato"
        );

        return;

    }


    // =========================================
    // VALORE ATTUALE
    // =========================================

    humidexValue =

    // =========================================

    // MASSIMA = VALORE ATTUALE
    // =========================================

    humidexMinRecorded =

    humidexMaxRecorded =

    // =========================================

    while (
        value >

        humidexGaugeMin +=

    while (

    // =========================================

// =========================================

// =========================================
// CALCOLO TEMPERATURA APPARENTE
// =========================================

function calculateApparentTemperature(
    temperature,
    dewpoint,
    wind
) {

    const T =
        Number(temperature);

    const Td =
        Number(dewpoint);

    const V =
        Number(wind);


    if (
        !Number.isFinite(T) ||
        !Number.isFinite(Td) ||
        !Number.isFinite(V)
    ) {

        console.warn(
            "❌ Temperatura apparente: dati non validi",
            {
                temperature,
                dewpoint,
                wind
            }
        );

        return null;

    }


    // =========================================
    // PRESSIONE DI VAPORE
    // =========================================

    const e =
        6.105 *
        Math.exp(
            17.27 * Td /
            (237.7 + Td)
        );


    // =========================================
    // TEMPERATURA APPARENTE
    // =========================================

    const apparentTemperature =
        T +
        0.33 * e -
        0.70 * V -
        4.00;


    return apparentTemperature;

}

    else if (value <= 500) {
        newMax = 500;
    }
    else if (value <= 750) {
        newMax = 750;
    }
    else if (value <= 1000) {
        newMax = 1000;
    }
    else if (value <= 1500) {
        newMax = 1500;
    }
    else {

    }


    if (
        RainGauge.getMaxValue() !== newMax
    ) {

        RainGauge.setMaxValue(
            newMax
        );

        RainGauge.setValue(0);

    }


    // Salva il valore attuale
    rainValue = value;


    RainGauge.setValueAnimated(
        rainValue
    );

}

// =========================================
// MOSTRA TOOLTIP
// =========================================

function showGaugeTooltip(
    gaugeElement,
    title,
    value,
    max,
    min,
    unit = "°"
) {

    gaugeElement.addEventListener("mouseenter", () => {

        gaugeTooltip.innerHTML = `
            <div class="gauge-tooltip-title">
                ${title}: <span class="gauge-tooltip-value">${Number(value).toFixed(1)}${unit}</span>
            </div>

            <div>
                Massima: ${Number(max).toFixed(1)}${unit}
                - Minima: ${Number(min).toFixed(1)}${unit}
            </div>
        `;

        gaugeTooltip.classList.add("visible");

    });


    gaugeElement.addEventListener("mousemove", (event) => {

        gaugeTooltip.style.left =
            (event.clientX + 15) + "px";

        gaugeTooltip.style.top =
            (event.clientY + 15) + "px";

    });


    gaugeElement.addEventListener("mouseleave", () => {

        gaugeTooltip.classList.remove("visible");

    });

}
