<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stazione Meteo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #000;
    }

    /* =========================
       FOTO FULL SCREEN
       ========================= */

    main {
      width: 100vw;
      height: 100vh;

      margin: 0;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    #stationImage {
      width: 100vw;
      height: 100vh;

      display: block;

      object-fit: contain;

      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    /* =========================
       ERRORE
       ========================= */

    #error {
      display: none;

      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      padding: 25px;

      max-width: 90%;

      background: white;

      border-radius: 12px;

      color: #a00000;

      text-align: center;

      font-family: Arial, sans-serif;

      box-shadow:
        0 5px 30px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

<body>

  <main>

    <div id="error"></div>

    <img
      id="stationImage"
      src=""
      alt="Immagine stazione"
    >

  </main>


  <script>

    // =========================
    // CONFIGURAZIONE STAZIONI
    // =========================

    const stationPhotos = {

      "IGENOA2897": {
        name: "IGENOA2897",
        photo: "SanMartino1.png"
      }

      // Altre stazioni:
      //
      // "IGENOA1234": {
      //   name: "IGENOA1234",
      //   photo: "Brignole.png"
      // },
      //
      // "IGENOA5678": {
      //   name: "IGENOA5678",
      //   photo: "Nervi.png"
      // }

    };


    // =========================
    // LEGGE URL
    // =========================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const station =
      params.get("station");


    // =========================
    // ELEMENTI
    // =========================

    const image =
      document.getElementById(
        "stationImage"
      );

    const error =
      document.getElementById(
        "error"
      );


    // =========================
    // MOSTRA FOTO
    // =========================

    if (
      !station ||
      !stationPhotos[station]
    ) {

      image.style.display =
        "none";

      error.style.display =
        "block";

      error.textContent =
        station
          ? `Stazione "${station}" non configurata.`
          : "Nessuna stazione specificata.";

    } else {

      const data =
        stationPhotos[station];

      image.src =
        data.photo;

      image.alt =
        data.name;


      // =========================
      // ERRORE IMMAGINE
      // =========================

      image.onerror = () => {

        image.style.display =
          "none";

        error.style.display =
          "block";

        error.textContent =
          `Impossibile trovare "${data.photo}".`;

      };

    }

  </script>

</body>
</html>
