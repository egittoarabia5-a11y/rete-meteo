<!DOCTYPE html>
<html lang="it">
<head>
    <title>Gauges</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: "Inter", sans-serif;
        }

        /* Immagine gauge */
        #gauge {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: block;
        }

/* Barra superiore */
.top-bar {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    height: 64px;

    display: flex;
    justify-content: center;   /* centra orizzontalmente */
    align-items: center;       /* centra verticalmente */

    padding: 0 24px;

    border-radius: 32px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.30),
            rgba(255,255,255,0.12) 45%,
            rgba(255,255,255,0.20)
        );

    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);

    border: 1px solid rgba(255,255,255,0.35);

    box-shadow:
        inset 0 -1px 2px rgba(0,0,0,0.15),
        0 8px 30px rgba(0,0,0,0.25);

    color: white;

    z-index: 1000;
}

/* Titolo */
.station-name {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.03em;

    text-align: center;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    width: 100%;
}
/* Griglia dei 15 riquadri */
.boxes {
    position: fixed;

    top: 95px;
    left: 10%;
    right: 10%;
    bottom: 14px;

    display: grid;

    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);

    gap: 14px;

    z-index: 900;
}


/* Riquadro */
.glass-box {
    width: 100%;
    height: 100%;

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.30),
            rgba(255,255,255,0.12) 45%,
            rgba(255,255,255,0.20)
        );

    backdrop-filter: blur(25px) saturate(180%);
    -webkit-backdrop-filter: blur(25px) saturate(180%);

    border: 1px solid rgba(255,255,255,0.22);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.25),
        inset 0 -1px 2px rgba(0,0,0,0.15),
        0 8px 30px rgba(0,0,0,0.25);
}
    </style>
</head>

<body>

    <img id="gauge" alt="Gauge">

    <!-- Barra superiore -->
    <div class="top-bar">
        <div class="station-name" id="stationName">
            Caricamento...
        </div>
    </div>

    <!-- 15 riquadri -->
    <div class="boxes">

        <div class="glass-box"></div>
        <div class="glass-box"></div>
        <div class="glass-box"></div>
        <div class="glass-box"></div>
        <div class="glass-box"></div>

        <div class="glass-box"></div>
        <div class="glass-box"></div>
        <div class="glass-box"></div>
        <div class="glass-box"></div>
        <div class="glass-box"></div>

        <div class="glass-box"></div>
        <div class="glass-box"></div>
        <div class="glass-box"></div>
        <div class="glass-box"></div>
        <div class="glass-box"></div>

    </div>

    <script>
        const StazioniWunderground = {
            "IGENOA2897": {
                name: "Genova San Martino - Fonte: Wunderground - Altitudine: 104 m.s.l.m.",
                link: "SanMartino1.png"
            },
            "IGENOA3085": {
                name: "Genova Sturla - Fonte: Wunderground - Altitudine: 74 m.s.l.m.",
                link: "Sturla1.png"
            },
            "IGENOA3052": {
                name: "Genova Boccadasse - Fonte: Wunderground - Altitudine: 41 m.s.l.m.",
                link: "Boccadasse1.png"
            }
        };

        const StazioniOMIRL = {
            "CFUNZ": {
                name: "Genova Centro Funzionale - Fonte: OMIRL - Altitudine: 25 m.s.l.m.",
                link: "CFUNZ2.png"
            }
        };


        // Legge i parametri dall'URL
        const params = new URLSearchParams(window.location.search);

        const station = params.get("station");
        const source = params.get("source");


        // Sceglie la lista corretta
        let stazione;

        if (source === "OMIRL") {
            stazione = StazioniOMIRL[station];
        }
        else if (source === "Wunderground") {
            stazione = StazioniWunderground[station];
        }


        const gauge = document.getElementById("gauge");
        const stationName = document.getElementById("stationName");


        // Mostra la stazione
        if (stazione) {

            gauge.src = stazione.link;
            gauge.alt = stazione.name;

            stationName.textContent = stazione.name;

            document.title = stazione.name;

        } else {

            stationName.textContent = "Stazione non trovata";

            document.body.innerHTML += `
                <div style="
                    position: fixed;
                    inset: 0;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    color: white;
                    font-family: Inter, sans-serif;
                ">
                    <h1>Stazione non trovata</h1>
                </div>
            `;
        }
    </script>

</body>
</html>
